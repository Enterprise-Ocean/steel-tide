    state.phase = 'action';
    pushLog(state, side, '第 ' + state.round + ' 轮 · ' + p.short + '回合：补给 ' + p.supply + '/' + p.cap +
      '，牌库 ' + p.deck.length + '。', 'turn');
    checkAnnihilation(state);
  }

  function applyStartOfTurnDamage(state, side) {
    const enemy = otherSide(side);
    const units = unitsOf(state, side).slice();
    for (const u of units) {
      if (u.hp <= 0) continue;
      let died = false;
      const diff = Math.abs(u.flood.port - u.flood.starboard);
      if (diff > 3) {
        pushLog(state, side, unitLabel(u) + ' 左右进水差达到 ' + diff + '，舰体倾覆沉没！', 'sink');
        sinkUnit(state, u, enemy, '进水失衡');
        died = true;
        if (state.finished) return true;
      }
      if (!died) {
        const fireDmg = u.fire * 2;
        const floodDmg = u.flood.port + u.flood.starboard;
        if (fireDmg > 0) {
          pushLog(state, side, unitLabel(u) + ' 起火 ' + u.fire + ' 层，损失 ' + fireDmg + ' 点耐久。', 'dot');
          applyHp(state, u, fireDmg, enemy, 'dot');
          if (u.hp <= 0) { sinkUnit(state, u, enemy, '起火'); died = true; }
        }
        if (!died && floodDmg > 0) {
          pushLog(state, side, unitLabel(u) + ' 进水（左 ' + u.flood.port + ' / 右 ' + u.flood.starboard + '），损失 ' + floodDmg + ' 点耐久。', 'dot');
          applyHp(state, u, floodDmg, enemy, 'dot');
          if (u.hp <= 0) { sinkUnit(state, u, enemy, '进水'); died = true; }
        }
      }
      if (state.finished) return true;
    }
    return false;
  }

  function returnEscorts(state, side) {
    // 战斗机留在场上，每回合刷新 6 点行动力；其他临时机队返航
    state.airUnits = state.airUnits.filter(a => a.side !== side || a.type === 'F');
    state.airUnits.forEach(a => {
      if (a.side !== side || a.type !== 'F') return;
      a.ap = a.apMax || 6;
      a.attacked = false;
      a.moved = false;
    });
  }

  function beginAction(state) {
    if (state.finished) return { ok: false, error: '对局已结束' };
    state.phase = 'action';
    return { ok: true };
  }

  function endTurn(state) {
    if (state.finished) return { ok: false, error: '对局已结束' };
    if (state.phase !== 'deploy' && state.phase !== 'action') return { ok: false, error: '当前阶段不能结束回合' };
    const side = state.active;
    const p = state.players[side];
    // 本回合对敌施加的禁移动/禁攻击，在受影响方回合结束时清除
    unitsOf(state, side).forEach(u => { u.debuffs = {}; });
    pushLog(state, side, p.short + '回合结束。', 'turn');

    if (side === 'B') {
      if (state.round >= state.maxRounds) { finishGame(state, '回合上限'); return { ok: true, finished: true }; }
      state.round++;
      state.active = 'A';
    } else {
      state.active = 'B';
    }
    state.turnSerial++;
    startTurn(state);
    return { ok: true };
  }

  /* ---------------- 部署 ---------------- */
  function isValidDeployCell(state, side, def, r, c) {
    if (!inBounds(r, c)) return false;
    if (!isDeployRow(state, side, r)) return false;
    const surf = surfaceAt(state, r, c);
    if (surf && surf.side !== side) return false;
    if (def.cls === 'SS') return !subAt(state, r, c);
    return !surf;
  }
  function deployCells(state, side, card) {
    const def = D.SHIP_DEFS[card.defId];
    const out = [];
    for (let r = 0; r < D.BOARD_ROWS; r++) for (let c = 0; c < D.BOARD_COLS; c++) {
      if (isValidDeployCell(state, side, def, r, c)) out.push({ r, c });
    }
    return out;
  }
  function deploy(state, cardUid, r, c) {
    if (state.finished) return { ok: false, error: '对局已结束' };
    if (state.phase !== 'action' && state.phase !== 'deploy') return { ok: false, error: '当前不能部署' };
    const side = state.active;
    const p = state.players[side];
    const idx = p.hand.findIndex(card => card.uid === cardUid);
    if (idx < 0) return { ok: false, error: '手牌中没有这张卡' };
    const card = p.hand[idx];
    if (card.kind !== 'ship') return { ok: false, error: '指令卡不能部署' };
    const def = D.SHIP_DEFS[card.defId];
    if (p.supply < def.cost) return { ok: false, error: '补给不足' };
    if (!isValidDeployCell(state, side, def, r, c)) return { ok: false, error: '该格不能部署' };
    p.hand.splice(idx, 1);
    p.supply -= def.cost;
    const u = createUnit(state, side, def, r, c);
    u.justDeployed = true;
    state.units.push(u);
    pushLog(state, side, unitLabel(u) + ' 部署至 R' + r + 'C' + c + '（补给 -' + def.cost + '）。', 'deploy');
    return { ok: true, unit: u };
  }

  /* ---------------- 移动 / 转向 / 行动点 ---------------- */
  function canMove(state, u) {
    return !!u && !state.finished && state.phase === 'action' && u.side === state.active &&
      u.ap > 0 && !u.justDeployed && !u.turned && u.turnProgress === 0 && !u.debuffs.rooted &&
      !u.firedMain && !u.firedSecondary && !u.firedTorp && !u.firedDepth && !u.firedAA && !u.launched;
  }
  function moveTargets(state, u) {
    if (!canMove(state, u)) return [];
    const vec = DIR_VEC[u.heading];
    const maxDist = u.ap + (u.buffs.move || 0);
    const out = [];
    let r = u.r, c = u.c;
    for (let d = 1; d <= maxDist; d++) {
      r += vec[0]; c += vec[1];
      if (!inBounds(r, c)) break;
      if (u.cls === 'SS') {
        if (subAt(state, r, c)) break;
      } else if (surfaceAt(state, r, c)) {
        break;
      }
      out.push({ r, c, dist: d });
    }
    return out;
  }
  function moveUnit(state, uid, r, c) {
    const u = getUnit(state, uid);
    if (!canMove(state, u)) return { ok: false, error: '该舰本回合不能移动' };
    const target = moveTargets(state, u).find(t => t.r === r && t.c === c);
    if (!target) return { ok: false, error: '只能沿舰首方向前进，且受行动点限制' };
    const from = { r: u.r, c: u.c };
    u.ap = Math.max(0, u.ap - target.dist);
    u.r = r; u.c = c;
    u.moved = true;
    pushLog(state, u.side, unitLabel(u) + ' R' + from.r + 'C' + from.c + ' → R' + r + 'C' + c +
      '（前进 ' + target.dist + ' 格，剩余行动点 ' + u.ap + '）。', 'move');
    return { ok: true, from, to: { r, c }, heading: u.heading, ap: u.ap, dist: target.dist };
  }
  function canTurn(state, u) {
    if (!u || state.finished || state.phase !== 'action' || u.side !== state.active) return false;
    if (u.ap < 1 || u.justDeployed || u.firedMain || u.firedSecondary || u.firedTorp || u.firedDepth || u.firedAA || u.launched) return false;
    return true;
  }
  function turnUnit(state, uid, heading) {
    const u = getUnit(state, uid);
    if (!u || u.side !== state.active || state.phase !== 'action') return { ok: false, error: '该舰本回合不能转向' };
    if (!['N', 'E', 'S', 'W'].includes(heading)) return { ok: false, error: '方向无效' };
    if (!canTurn(state, u)) return { ok: false, error: u.ap < 1 ? '没有行动点' : (u.justDeployed ? '刚部署本回合不能转向' : '开火后不能转向') };
    if (u.turnProgress > 0) {
      if (heading !== u.turnTarget) return { ok: false, error: '转向进行中，只能继续当前方向' };
      u.ap -= 1;
      u.turnProgress += 1;
      u.turned = true;
      if (u.turnProgress >= u.turnCost) {
        u.heading = u.turnTarget;
        u.turnProgress = 0;
        u.turnTarget = null;
        pushLog(state, u.side, unitLabel(u) + ' 完成转向，舰首朝' + headingName(u.heading) + '；本轮仍按转向前的炮位开火。', 'move');
      } else {
        pushLog(state, u.side, unitLabel(u) + ' 转向中 ' + u.turnProgress + '/' + u.turnCost + '，舰首暂朝' + headingName(u.heading) + '。', 'move');
      }
    } else {
      if (!u.turnPreHeading) u.turnPreHeading = u.heading;
      u.turnTarget = heading;
      u.turnProgress = 1;
      u.ap -= 1;
      u.turned = true;
      if (u.turnProgress >= u.turnCost) {
        u.heading = heading;
        u.turnProgress = 0;
        u.turnTarget = null;
        pushLog(state, u.side, unitLabel(u) + ' 转向，舰首朝' + headingName(u.heading) + '；本轮仍按转向前的炮位开火。', 'move');
      } else {
        pushLog(state, u.side, unitLabel(u) + ' 开始转向 ' + headingName(heading) + '，进度 1/' + u.turnCost +
          '，舰首暂朝' + headingName(u.heading) + '。', 'move');
      }
    }
    return { ok: true, heading: u.heading, target: u.turnTarget || u.heading, progress: u.turnProgress, cost: u.turnCost, ap: u.ap, turned: u.turned };
  }

  /* ---------------- 开火 ---------------- */
  function canFireMain(state, u) {
    return !!u && u.main && !u.firedMain && u.side === state.active && state.phase === 'action' && !u.debuffs.dazed;
  }
  function canFireSecondary(state, u) {
    return !!u && u.secondary && !u.firedSecondary && u.side === state.active && state.phase === 'action' && !u.debuffs.dazed;
  }
  function canFireTorp(state, u, side) {
    if (!u || !(u.torpedo > 0) || !u.torpedoState || u.side !== state.active || state.phase !== 'action' || u.debuffs.dazed) return false;
    if (side) {
      const st = u.torpedoState[side];
      return !!st && !st.fired && st.reload <= 0;
    }
    if (u.cls === 'SS') return !u.torpedoState.fore.fired && u.torpedoState.fore.reload <= 0;
    return ['port', 'starboard'].some(s => {
      const st = u.torpedoState[s];
      return st && !st.fired && st.reload <= 0;
    });
  }
  function canFireDepth(state, u) {
    return !!u && u.asw > 0 && !u.firedDepth && u.side === state.active && state.phase === 'action' && !u.debuffs.dazed;
  }
  function mainTargets(state, u) {
    if (!canFireMain(state, u)) return [];
    return state.units.filter(t => t.side !== u.side && t.cls !== 'SS' && dist(u, t) <= u.main.range &&
      (u.main.arcs[arcOf(u, t)] || 0) > 0 && !t.buffs.smoke);
  }
  function secondaryTargets(state, u) {
    if (!canFireSecondary(state, u)) return [];
    return state.units.filter(t => t.side !== u.side && t.cls !== 'SS' && dist(u, t) <= u.secondary.range &&
      (u.secondary.arcs[arcOf(u, t)] || 0) > 0 && !t.buffs.smoke);
  }
  function torpedoTargets(state, u, side) {
    if (u && u.cls === 'SS') side = 'fore';
    if (!canFireTorp(state, u, side)) return [];
    const sides = side ? [side] : (u.cls === 'SS' ? ['fore'] : ['port', 'starboard']);
    return state.units.filter(t => {
      if (t.side === u.side || t.cls === 'SS' || dist(u, t) !== 1) return false;
      return sides.includes(arcOf(u, t));
    });
  }
  function depthTargets(state, u) {
    if (!canFireDepth(state, u)) return [];
    return state.units.filter(t => t.side !== u.side && t.cls === 'SS' && t.hp > 0 && dist(u, t) <= 1 &&
      isSubDetected(state, t, u.side));
  }

  function mainAttackInfo(attacker, target) {
    if (!attacker.main) return null;
    const info = gunInfo(attacker, target, attacker.main);
    if (info.barrels <= 0) return null;
    const raw = info.raw + (attacker.buffs.gun || 0);
    const armor = target.armor + (target.buffs.armor || 0);
    return { arc: info.arc, barrels: info.barrels, max: info.max, raw, final: Math.max(1, raw - armor), armor };
  }
  function secondaryAttackInfo(attacker, target) {
    if (!attacker.secondary) return null;
    const info = gunInfo(attacker, target, attacker.secondary);
    if (info.barrels <= 0) return null;
    const raw = info.raw;
    const armor = target.armor + (target.buffs.armor || 0);
    return { arc: info.arc, barrels: info.barrels, max: info.max, raw, final: Math.max(0, raw - armor), armor };
  }
  function torpedoAttackInfo(attacker, target) {
    const raw = attacker.torpedo + (attacker.buffs.torp || 0);
    const bulk = target.bulkhead + (target.buffs.bulkhead || 0);
    return { raw, final: Math.max(1, raw - bulk), bulk };
  }

  function fireMain(state, uid, targetUid) {
    const u = getUnit(state, uid), t = getUnit(state, targetUid);
    if (!canFireMain(state, u)) return { ok: false, error: '本回合不能再开主炮' };
    if (!t || t.side === u.side || t.cls === 'SS') return { ok: false, error: '目标无效' };
    if (dist(u, t) > u.main.range) return { ok: false, error: '目标超出主炮射程' };
    const info = mainAttackInfo(u, t);
    if (!info) return { ok: false, error: '目标不在主炮射界内' };
    if (t.buffs.smoke) return { ok: false, error: '目标被烟幕遮蔽' };
    u.firedMain = true;
    const res = applyHp(state, t, info.final, u.side, 'gun');
    let fire = 0;
    if (!res.sunk) {
      fire = info.final >= 8 ? 2 : info.final >= 5 ? 1 : 0;
      if (fire) { t.fire += fire; }
    }
    pushLog(state, u.side, unitLabel(u) + ' 主炮（' + info.arc + ' ' + info.barrels + '/' + info.max + ' 门）命中 ' +
      unitLabel(t) + '，造成 ' + info.final + ' 点伤害' + (fire ? '，起火 ' + fire + ' 层' : '') +
      (res.sunk ? '，目标沉没！' : '（剩余 ' + res.hp + '）。'), 'combat');
    return { ok: true, kind: 'main', damage: info.final, hp: res.hp, sunk: res.sunk, points: res.points || 0, fire, info };
  }
  function fireSecondary(state, uid, targetUid) {
    const u = getUnit(state, uid), t = getUnit(state, targetUid);
    if (!canFireSecondary(state, u)) return { ok: false, error: '本回合不能再开副炮' };
    if (!t || t.side === u.side || t.cls === 'SS') return { ok: false, error: '目标无效' };
    if (dist(u, t) > u.secondary.range) return { ok: false, error: '目标超出副炮射程' };
    const info = secondaryAttackInfo(u, t);
    if (!info) return { ok: false, error: '目标不在副炮射界内' };
    if (t.buffs.smoke) return { ok: false, error: '目标被烟幕遮蔽' };
    u.firedSecondary = true;
    if (info.final <= 0) {
      pushLog(state, u.side, unitLabel(u) + ' 副炮命中 ' + unitLabel(t) + '，但未能击穿装甲。', 'combat');
      return { ok: true, kind: 'secondary', damage: 0, hp: t.hp, sunk: false, points: 0, fire: 0, info };
    }
    const res = applyHp(state, t, info.final, u.side, 'secondary');
    let fire = 0;
    if (!res.sunk && info.final >= 6) { fire = 1; t.fire += 1; }
    pushLog(state, u.side, unitLabel(u) + ' 副炮（' + info.arc + ' ' + info.barrels + ' 门）命中 ' + unitLabel(t) +
      '，造成 ' + info.final + ' 点伤害' + (fire ? '，起火 1 层' : '') + (res.sunk ? '，目标沉没！' : '（剩余 ' + res.hp + '）。'), 'combat');
    return { ok: true, kind: 'secondary', damage: info.final, hp: res.hp, sunk: res.sunk, points: res.points || 0, fire, info };
  }
  function fireTorpedo(state, uid, targetUid, sideArg) {
    const u = getUnit(state, uid), t = getUnit(state, targetUid);
    if (!u || !t || t.side === u.side || t.cls === 'SS') return { ok: false, error: '目标无效' };
    if (dist(u, t) !== 1) return { ok: false, error: '目标超出鱼雷射程' };
    let side;
    if (u.cls === 'SS') {
      if (arcOf(u, t) !== 'fore') return { ok: false, error: '潜艇只有舰首鱼雷，目标必须在舰首' };
      side = 'fore';
    } else {
      const a = arcOf(u, t);
      if (a !== 'port' && a !== 'starboard') return { ok: false, error: '鱼雷只能攻击左舷或右舷目标' };
      if (sideArg && sideArg !== a) return { ok: false, error: '目标不在该侧鱼雷射界内' };
      side = a;
    }
    if (!canFireTorp(state, u, side)) return { ok: false, error: '该侧鱼雷正在装填或本回合已发射' };
    const info = torpedoAttackInfo(u, t);
    const st = u.torpedoState[side];
    st.fired = true;
    st.reload = 1;
    u.firedTorp = true;
    if (u.cls === 'SS') u.exposed = true;
    const res = applyHp(state, t, info.final, u.side, 'torpedo');
    let floodSide = null, flood = 0;
    if (!res.sunk) {
      floodSide = relativeArc(t, u);
      if (floodSide === 'fore' || floodSide === 'aft') floodSide = t.flood.port <= t.flood.starboard ? 'port' : 'starboard';
      flood = info.final >= 8 ? 2 : 1;
      t.flood[floodSide] += flood;
      if (Math.abs(t.flood.port - t.flood.starboard) > 3) {
        pushLog(state, u.side, unitLabel(t) + ' 进水失衡（左 ' + t.flood.port + ' / 右 ' + t.flood.starboard + '），倾覆沉没！', 'sink');
        sinkUnit(state, t, u.side, '进水失衡');
        return { ok: true, kind: 'torpedo', side, damage: info.final, hp: 0, sunk: true, points: t.points, flood, floodSide, info };
      }
    }
    const sideLabel = side === 'fore' ? '舰首' : side === 'port' ? '左舷' : '右舷';
    pushLog(state, u.side, unitLabel(u) + ' ' + sideLabel + '鱼雷命中 ' + unitLabel(t) + '，造成 ' + info.final +
      ' 点伤害' + (flood ? '，' + (floodSide === 'port' ? '左舷' : '右舷') + '进水 ' + flood : '') +
      (res.sunk ? '，目标沉没！' : '（剩余 ' + res.hp + '）。') + (u.cls === 'SS' ? ' 潜艇暴露。' : ''), 'combat');
    return { ok: true, kind: 'torpedo', side, damage: info.final, hp: res.hp, sunk: res.sunk, points: res.points || 0, flood, floodSide, info };
  }
  function fireDepth(state, uid, targetUid) {
    const u = getUnit(state, uid), t = getUnit(state, targetUid);
    if (!canFireDepth(state, u)) return { ok: false, error: '本回合不能再投深弹' };
    if (!t || t.cls !== 'SS' || t.side === u.side) return { ok: false, error: '目标无效' };
    if (dist(u, t) > 1) return { ok: false, error: '目标超出深弹射程' };
    if (!isSubDetected(state, t, u.side)) return { ok: false, error: '未发现该潜艇' };
    u.firedDepth = true;
    const res = applyHp(state, t, u.asw, u.side, 'depth');
    pushLog(state, u.side, unitLabel(u) + ' 投下深水炸弹，命中 ' + unitLabel(t) + ' ' + u.asw + ' 点' +
      (res.sunk ? '，潜艇沉没！' : '（剩余 ' + res.hp + '）。'), 'combat');
    return { ok: true, kind: 'depth', damage: u.asw, hp: res.hp, sunk: res.sunk, points: res.points || 0 };
  }

  /* ---------------- 防空炮 ---------------- */
  function aaPower(u) {
    return Math.max(0, u.aa - (u.aaDown || 0) + (u.buffs.aa || 0));
  }
  function canFireAA(state, u) {
    return !!u && aaPower(u) > 0 && !u.firedAA && u.side === state.active && state.phase === 'action' && !u.debuffs.dazed;
  }
  function aaTargets(state, u) {
    if (!canFireAA(state, u)) return [];
    return state.airUnits.filter(a => a.side !== u.side && a.type === 'F' && a.planes.length > 0 &&
      cellDist(u.r, u.c, a.r, a.c) <= 1);
  }
  function aaAttackValue(u) { return aaPower(u); }
  function fireAA(state, uid, targetAirUid) {
    const u = getUnit(state, uid);
    if (!canFireAA(state, u)) return { ok: false, error: '本回合不能再进行防空射击' };
    const t = state.airUnits.find(a => a.uid === targetAirUid);
    if (!t || t.side === u.side || t.type !== 'F') return { ok: false, error: '目标不是敌方战斗机' };
    if (cellDist(u.r, u.c, t.r, t.c) > 1) return { ok: false, error: '目标超出防空炮射程' };
    u.firedAA = true;
    const power = aaPower(u);
    const lost = applyPlaneDamage(t.planes, power);
    state.airUnits = state.airUnits.filter(a => a.planes.length > 0);
    pushLog(state, u.side, unitLabel(u) + ' 防空炮射击敌方战斗机，击落 ' + lost.length + ' 架' +
      (t.planes.length ? '（剩余 ' + t.planes.length + ' 架）。' : '，敌机全灭！'), 'combat');
    return { ok: true, kind: 'aa', power, lost: lost.length, left: t.planes.length };
  }

  /* ---------------- 潜艇探测 ---------------- */
  function isSubDetected(state, sub, viewer) {
    if (!sub || sub.cls !== 'SS') return false;
    if (sub.exposed) return true;
    if (state.revealAll[viewer] === state.turnSerial) return true;
    const rec = state.recon[viewer];
    if (rec && rec.row === sub.r && rec.turn === state.turnSerial) return true;
    return unitsOf(state, viewer).some(u => {
      if (u.cls === 'DD' || u.cls === 'CVE' || u.cls === 'SS') {
        if (u.r === sub.r) return true;
        if ((u.cls === 'DD' || u.cls === 'CVE') && u.searchBoost && Math.abs(u.r - sub.r) <= 1) return true;
      }
      return false;
    });
  }
  function visibleSubs(state, viewer) { return state.units.filter(u => u.side !== viewer && u.cls === 'SS' && isSubDetected(state, u, viewer)); }
  function unknownSubRows(state, viewer) {
    const rows = {};
    state.units.forEach(u => { if (u.side !== viewer && u.cls === 'SS' && !isSubDetected(state, u, viewer)) rows[u.r] = true; });
    return Object.keys(rows).map(Number);
  }
  function searchRow(state, uid) {
    const u = getUnit(state, uid);
    if (!u || u.side !== state.active || state.phase !== 'action') return { ok: false, error: '该舰不能搜索' };
    if (u.cls !== 'DD' && u.cls !== 'CVE') return { ok: false, error: '只有驱逐舰/护航航母能主动搜索' };
    if (u.searchBoost) return { ok: false, error: '本回合已经搜索过' };
    u.searchBoost = true;
    pushLog(state, u.side, unitLabel(u) + ' 主动搜索：本回合可探测相邻线潜艇。', 'sub');
    return { ok: true };
  }
  function reconRow(state, row) {
    if (state.finished || state.phase !== 'action') return { ok: false, error: '当前不能侦察' };
    const side = state.active;
    const p = state.players[side];
    if (p.reconUsed) return { ok: false, error: '本回合已经侦察过' };
    if (!inBounds(row, 0)) return { ok: false, error: '行号无效' };
    p.reconUsed = true;
    state.recon[side] = { row, turn: state.turnSerial };
    const subs = state.units.filter(u => u.side !== side && u.cls === 'SS' && u.r === row);
    pushLog(state, side, p.short + '侦察 R' + row + (subs.length ? '，发现 ' + subs.length + ' 艘敌潜艇。' : '，未发现潜艇。'), 'sub');
    return { ok: true, subs: subs.map(s => s.uid) };
  }

  /* ---------------- 伤害 / 起火 / 进水 ---------------- */
  function applyHp(state, target, dmg, sourceSide, kind) {
    target.hp -= dmg;
    if (target.hp > 0) return { sunk: false, hp: target.hp };
    target.hp = 0;
    sinkUnit(state, target, sourceSide, kind);
    return { sunk: true, hp: 0, points: target.points };
  }
  function sinkUnit(state, unit, sourceSide, reason) {
    const idx = state.units.indexOf(unit);
    if (idx < 0) return;
    state.units.splice(idx, 1);
    const p = state.players[sourceSide];
    if (p) p.sinkPoints += unit.points;
    pushLog(state, sourceSide, '击沉 ' + unitLabel(unit) + '（' + unit.cls + '，' + unit.points + ' 点）' +
      (reason ? ' · ' + reason : ''), 'sink');
    if (unit.air) {
      state.airUnits = state.airUnits.filter(a => {
        if (a.carrierUid === unit.uid && a.type !== 'F') {
          pushLog(state, unit.side, unitLabel(unit) + ' 沉没，' + a.planes.length + ' 架舰载机坠海。', 'air');
          return false;
        }
        return true;
      });
    }
    checkVictory(state);
  }
  function checkVictory(state) {
    if (state.finished) return;
    const alive = { A: false, B: false };
    ['A', 'B'].forEach(s => {
      const p = state.players[s];
      alive[s] = unitsOf(state, s).length > 0 || p.hand.some(c => c.kind === 'ship') || p.deck.some(c => c.kind === 'ship');
    });
    if (!alive.A && !alive.B) { finishGame(state, '双方舰队全灭', null); return; }
    if (!alive.A) { finishGame(state, '盟军舰队全灭', 'B'); return; }
    if (!alive.B) { finishGame(state, '轴心舰队全灭', 'A'); return; }
  }
  function checkAnnihilation(state) {
    if (state.finished) return;
    const p = state.players[state.active];
    if (unitsOf(state, state.active).length === 0 &&
      !p.hand.some(c => c.kind === 'ship') && !p.deck.some(c => c.kind === 'ship')) {
      finishGame(state, p.short + '已无舰可战', otherSide(state.active));
    }
  }
  function finishGame(state, reason, forcedWinner) {
    if (state.finished) return;
    state.finished = true;
    state.phase = 'gameover';
    state.endReason = reason;
    let winner = forcedWinner || null;
    if (!winner) {
      const a = state.players.A.sinkPoints, b = state.players.B.sinkPoints;
      if (a > b) winner = 'A'; else if (b > a) winner = 'B';
      else {
        const sa = fleetStrength(state, 'A'), sb = fleetStrength(state, 'B');
        if (sa > sb) winner = 'A'; else if (sb > sa) winner = 'B';
      }
    }
    state.winner = winner;
    pushLog(state, winner, '战役结束（' + reason + '）：' + (winner ? state.players[winner].short + '获胜' : '平局') +
      '。击沉点数 ' + state.players.A.sinkPoints + ' : ' + state.players.B.sinkPoints, 'system');
  }
  function fleetStrength(state, side) {
    return unitsOf(state, side).reduce((s, u) => s + u.points + Math.round(u.hp / u.maxHp * 10), 0);
  }

  /* ---------------- 航空 ---------------- */
  function strikePathValid(state, carrier, type, path) {
    if (!carrier || !path || !path.length) return { ok: false, error: '航路为空' };
    if (path.length > D.MAX_PATH) return { ok: false, error: '航路最多 ' + D.MAX_PATH + ' 格' };
    let pr = carrier.r, pc = carrier.c;
    const seen = { [pr + ',' + pc]: true };
    for (const step of path) {
      if (!inBounds(step.r, step.c)) return { ok: false, error: '航路越界' };
      if (cellDist(pr, pc, step.r, step.c) !== 1) return { ok: false, error: '航路必须逐格相邻' };
      const k = step.r + ',' + step.c;
      if (seen[k]) return { ok: false, error: '航路不能重复' };
      seen[k] = true; pr = step.r; pc = step.c;
    }
    const last = path[path.length - 1];
    const enemyShip = state.units.find(u => u.side !== carrier.side && u.cls !== 'SS' && u.r === last.r && u.c === last.c);
    const friendly = state.units.find(u => u.side === carrier.side && u.cls !== 'SS' && u.r === last.r && u.c === last.c);
    const enemyAir = state.airUnits.filter(a => a.side !== carrier.side && a.r === last.r && a.c === last.c);
    if (type === 'F') {
      if (!enemyShip && !friendly && !enemyAir.length) return { ok: false, error: '战斗机需要以舰船或敌机为目标格' };
    } else if (!enemyShip) return { ok: false, error: '目标格必须有敌水面舰' };
    return { ok: true, targetCell: last, enemyShip, friendly, enemyAir };
  }
  function computeCellAA(state, r, c, defenderSide, targetR, targetC, dogfight) {
    let total = 0;
    state.units.forEach(u => {
      if (u.side !== defenderSide || u.cls === 'SS' || u.r !== r || u.c !== c) return;
      total += Math.max(0, u.aa - (u.aaDown || 0) + (u.buffs.aa || 0));
    });
    const near = cellDist(r, c, targetR, targetC) <= 1;
    const coeff = near ? 1 : 0.5;
    let per = roundHalfUp(total * coeff);
    if (dogfight && r === targetR && c === targetC) per = Math.floor(per / 2);
    return { total, coeff, per };
  }
  function applyPlaneDamage(planes, amount) {
    let left = amount;
    const lost = [];
    while (left > 0 && planes.length) {
      const p = planes[0];
      const d = Math.min(p.hp, left);
      p.hp -= d; left -= d;
      if (p.hp <= 0) lost.push(planes.shift());
    }
    return lost;
  }
  function carrierStrike(state, carrierUid, type, path) {
    const c = getUnit(state, carrierUid);
    if (!c || c.side !== state.active || state.phase !== 'action') return { ok: false, error: '该航母不能出击' };
    if (!c.air) return { ok: false, error: '该舰没有舰载机' };
    if (c.launched || c.debuffs.dazed) return { ok: false, error: '本回合已经出击' };
    const g = airGroup(c, type);
    if (!g || !g.planes.length) return { ok: false, error: '该中队没有可用飞机' };
    const v = strikePathValid(state, c, type, path);
    if (!v.ok) return v;
    const target = v.targetCell;
    const defender = otherSide(c.side);
    const targetShip = v.enemyShip;
    const targetName = targetShip ? targetShip.name : '';
    const fighters = state.airUnits.filter(a => a.side === defender && a.type === 'F' && a.r === target.r && a.c === target.c);
    const hasDF = fighters.length > 0;
    const planes = g.planes.map(p => ({ hp: p.hp, maxHp: p.maxHp, dmgTaken: 0 }));
    const startPlanes = planes.length;
    const steps = [];
    let wiped = false;
    for (let i = 0; i < path.length; i++) {
      const cell = path[i];
      const isTarget = i === path.length - 1;
      const aa = computeCellAA(state, cell.r, cell.c, defender, target.r, target.c, hasDF && isTarget);
      const lost = [];
      for (let j = planes.length - 1; j >= 0; j--) {
        const p = planes[j];
        const capLeft = 3 - p.dmgTaken;
        if (capLeft <= 0) continue;
        const d = Math.min(capLeft, aa.per);
        p.dmgTaken += d; p.hp -= d;
        if (p.hp <= 0) { lost.push(p); planes.splice(j, 1); }
      }
      steps.push({ r: cell.r, c: cell.c, aa: aa.total, coeff: aa.coeff, perPlane: aa.per, losses: lost.length, alive: planes.length });
      if (!planes.length) { wiped = true; break; }
      if (!isTarget) {
        const cellFighters = state.airUnits.filter(a => a.side === defender && a.type === 'F' && a.r === cell.r && a.c === cell.c);
        if (cellFighters.length) {
          let fPool = [];
          cellFighters.forEach(a => { fPool = fPool.concat(a.planes); a.planes = []; });
          const fDmg = fPool.length;
          if (type === 'F') {
            applyPlaneDamage(planes, fDmg);
            applyPlaneDamage(fPool, planes.length + lost.length);
          } else {
            applyPlaneDamage(planes, fDmg);
          }
          let k = 0;
          while (fPool.length && cellFighters.length) {
            cellFighters[k % cellFighters.length].planes.push(fPool.shift());
            k++;
          }
          state.airUnits = state.airUnits.filter(a => a.planes.length > 0);
          if (!planes.length) { wiped = true; break; }
        }
      }
    }
    let dogfight = null, shipDamage = 0, sunk = false, fire = 0, flood = 0, floodSide = null, escort = null;
    if (!wiped) {
      if (hasDF) {
        const atkDmg = type === 'F' ? planes.length : 0;
        let pool = [];
        fighters.forEach(a => { pool = pool.concat(a.planes); a.planes = []; });
        const defDmg = pool.length;
        const atkLost = applyPlaneDamage(planes, defDmg);
        const defLost = applyPlaneDamage(pool, atkDmg);
        let k = 0;
        while (pool.length && fighters.length) { fighters[k % fighters.length].planes.push(pool.shift()); k++; }
        state.airUnits = state.airUnits.filter(a => a.planes.length > 0);
        dogfight = { atkLost: atkLost.length, defLost: defLost.length };
        pushLog(state, c.side, '空战：' + c.name + ' 机队与敌战斗机缠斗，击落 ' + defLost.length + ' 架，损失 ' + atkLost.length + ' 架。', 'air');
      }
      if (type !== 'F' && targetShip && targetShip.hp > 0 && planes.length) {
        const per = type === 'DB' ? 2 : 3;
        let raw = planes.length * per;
        if (type === 'TB') raw += (c.buffs.torp || 0);
        let final;
        if (type === 'TB') final = Math.max(1, raw - targetShip.bulkhead);
        else final = Math.max(1, raw);
        const res = applyHp(state, targetShip, final, c.side, type === 'TB' ? 'airTorp' : 'bomb');
        shipDamage = final;
        sunk = res.sunk;
        if (!sunk) {
          if (type === 'DB' && final >= 5) { fire = 1; targetShip.fire += 1; }
          if (type === 'TB') {
            floodSide = targetShip.flood.port <= targetShip.flood.starboard ? 'port' : 'starboard';
            flood = final >= 8 ? 2 : 1;
            targetShip.flood[floodSide] += flood;
            if (Math.abs(targetShip.flood.port - targetShip.flood.starboard) > 3) {
              pushLog(state, c.side, unitLabel(targetShip) + ' 进水失衡，倾覆沉没！', 'sink');
              sinkUnit(state, targetShip, c.side, '进水失衡');
              sunk = true;
            }
          }
        }
        pushLog(state, c.side, c.name + ' 的' + D.PLANE_INFO[type].name + '队（' + planes.length + ' 架）攻击 ' +
          unitLabel(targetShip) + '，造成 ' + shipDamage + ' 点伤害' + (fire ? '，起火' : '') +
          (flood ? '，进水 ' + flood : '') + (sunk ? '，击沉！' : '。'), 'air');
      }
      if (type === 'F' && planes.length) {
        const air = {
          uid: state.nextAirUid++, side: c.side, carrierUid: c.uid, type: 'F',
          planes, r: target.r, c: target.c, ap: 6, apMax: 6, attacked: false, moved: false
        };
        state.airUnits.push(air);
        escort = { r: target.r, c: target.c };
        if (targetShip && targetShip.hp > 0) {
          targetShip.aaDown = (targetShip.aaDown || 0) + planes.length;
          pushLog(state, c.side, c.name + ' 的 ' + planes.length + ' 架战斗机压制 ' + targetShip.name +
            '，其防空永久 -' + planes.length + '。', 'air');
        } else if (v.friendly) {
          pushLog(state, c.side, c.name + ' 派出 ' + planes.length + ' 架战斗机为 ' + v.friendly.name + ' 护航，战斗机留在战场。', 'air');
        } else {
          pushLog(state, c.side, c.name + ' 的 ' + planes.length + ' 架战斗机留在战场。', 'air');
        }
        g.planes = [];
      }
      if (type !== 'F') g.planes = planes;
    } else {
      g.planes = [];
      pushLog(state, c.side, c.name + ' 的' + D.PLANE_INFO[type].name + '队在抵达前被全部击落。', 'air');
    }
    c.launched = true;
    const survivors = escort ? planes.length : g.planes.length;
    const lostTotal = startPlanes - survivors;
    if (lostTotal > 0) pushLog(state, c.side, '本次出击损失 ' + lostTotal + ' 架飞机（机库永久减员）。', 'air');
    return { ok: true, kind: 'air', type, path, steps, startPlanes, survivors, lost: lostTotal,
      dogfight, shipDamage, sunk, fire, flood, floodSide, jam: 0, escort, targetCell: target, targetName,
      targetPoints: targetShip ? targetShip.points : 0 };
  }

  /* ---------------- 指令卡 ---------------- */
  function replenishCarrierAir(carrier, amount) {
    const def = D.SHIP_DEFS[carrier.defId];
    if (!def || !def.air || !carrier.air) return 0;
    let left = amount, added = 0;
    while (left > 0) {
      let best = null, bestMissing = 0;
      carrier.air.forEach(g => {
        const max = def.air[g.type] || 0;
        const missing = max - g.planes.length;
        if (missing > bestMissing) { best = g; bestMissing = missing; }
      });
      if (!best) break;
      best.planes.push({ hp: D.PLANE_INFO[best.type].hp, maxHp: D.PLANE_INFO[best.type].hp });
      left--; added++;
    }
    return added;
  }

  function combinedCarrierStrike(state, picks, targetUid) {
    if (!state || state.finished || state.phase !== 'action') return { ok: false, error: '当前不能出击' };
    const target = getUnit(state, targetUid);
    if (!target || target.side === state.active || target.cls === 'SS') return { ok: false, error: '目标无效' };
    if (!picks || !picks.length) return { ok: false, error: '没有选择舰载机' };
    const squads = [];
    const seen = {};
    for (const pick of picks) {
      const carrier = getUnit(state, pick.carrierUid);
      if (!carrier || carrier.side !== state.active || carrier.launched || carrier.debuffs.dazed) return { ok: false, error: '有航母本回合不能出击' };
      if (cellDist(carrier.r, carrier.c, target.r, target.c) > D.MAX_PATH) return { ok: false, error: carrier.name + ' 超出航程' };
      const g = airGroup(carrier, pick.type);
      if (!g || !g.planes.length) return { ok: false, error: carrier.name + ' 没有该中队' };
      const key = carrier.uid + ':' + pick.type;
      if (seen[key]) continue;
      seen[key] = true;
      squads.push({ carrier, type: pick.type, planes: g.planes.map(p => ({ hp: p.hp, maxHp: p.maxHp, dmgTaken: 0 })) });
    }
    if (!squads.length) return { ok: false, error: '没有可用机队' };
    const defender = otherSide(state.active);
    const enemyFighters = state.airUnits.filter(a => a.side === defender && a.type === 'F' && a.r === target.r && a.c === target.c);
    const aa = computeCellAA(state, target.r, target.c, defender, target.r, target.c, enemyFighters.length > 0);
    let defPool = [];
    enemyFighters.forEach(a => { defPool = defPool.concat(a.planes); a.planes = []; });
    const defF = defPool.length;
    let atkF = 0;
    squads.forEach(s => { if (s.type === 'F') atkF += s.planes.length; });
    const planeAA = Math.min(3, aa.per);
    squads.forEach(s => {
      s.planes.forEach(p => {
        p.dmgTaken += planeAA; p.hp -= planeAA;
      });
    });
    if (defF) {
      squads.forEach(s => applyPlaneDamage(s.planes, defF));
      if (atkF) applyPlaneDamage(defPool, atkF);
    }
    let k = 0;
    while (defPool.length && enemyFighters.length) { enemyFighters[k % enemyFighters.length].planes.push(defPool.shift()); k++; }
    state.airUnits = state.airUnits.filter(a => a.planes.length > 0);
    let db = 0, tb = 0, f = 0;
    squads.forEach(s => {
      const alive = s.planes.filter(p => p.hp > 0);
      s.planes = alive;
      if (s.type === 'F') f += alive.length;
      if (s.type === 'DB') db += alive.length;
      if (s.type === 'TB') tb += alive.length;
    });
    let shipDamage = 0, fire = 0, flood = 0, sunk = false, floodSide = null;
    if (db > 0 && target.hp > 0) {
      const dmg = Math.max(1, db * 2);
      const r = applyHp(state, target, dmg, state.active, 'bomb');
      shipDamage += dmg; sunk = r.sunk;
      if (!sunk && dmg >= 5) { fire = 1; target.fire += 1; }
    }
    if (tb > 0 && target.hp > 0) {
      let raw = tb * 3;
      squads.forEach(s => { if (s.type === 'TB') raw += (s.carrier.buffs.torp || 0); });
      const dmg = Math.max(1, raw - target.bulkhead - (target.buffs.bulkhead || 0));
      const r = applyHp(state, target, dmg, state.active, 'airTorp');
      shipDamage += dmg; sunk = r.sunk;
      if (!sunk) {
        floodSide = target.flood.port <= target.flood.starboard ? 'port' : 'starboard';
        flood = dmg >= 8 ? 2 : 1;
        target.flood[floodSide] += flood;
        if (Math.abs(target.flood.port - target.flood.starboard) > 3) {
          sinkUnit(state, target, state.active, '进水失衡');
          sunk = true;
        }
      }
    }
    if (f > 0 && target.hp > 0) {
      target.aaDown = (target.aaDown || 0) + f;
    }
    squads.forEach(s => {
      s.carrier.launched = true;
      if (s.type === 'F') {
        if (s.planes.length) {
          state.airUnits.push({
            uid: state.nextAirUid++, side: s.carrier.side, carrierUid: s.carrier.uid, type: 'F',
            planes: s.planes, r: target.r, c: target.c, ap: 6, apMax: 6, attacked: false, moved: false
          });
        }
        airGroup(s.carrier, 'F').planes = [];
      } else {
        airGroup(s.carrier, s.type).planes = s.planes;
      }
    });
    pushLog(state, state.active, '联合出击：' + squads.length + ' 个中队攻击 ' + unitLabel(target) +
      '，只承受一次防空（每机 ' + planeAA + '），造成 ' + shipDamage + ' 点伤害' +
      (fire ? '，起火' : '') + (flood ? '，进水 ' + flood : '') + (sunk ? '，击沉！' : '。') +
      (f ? ' 战斗机压制防空 -' + f + '。' : ''), 'air');
    return { ok: true, kind: 'combined', damage: shipDamage, fire, flood, floodSide, sunk,
      points: sunk ? target.points : 0, aa: aa.total, perPlane: planeAA, fighters: f };
  }

  function commandTargets(state, side, cmd) {
    const own = unitsOf(state, side);
    if (cmd.target === 'none') return [];
    if (cmd.target === 'own') {
      switch (cmd.effect) {
        case 'repair': return own.filter(u => u.fire > 0 || u.flood.port + u.flood.starboard > 0);
        case 'buffGun': return own.filter(u => u.main);
        case 'buffTorp': return own.filter(u => u.torpedo > 0 || (u.air && u.air.some(g => g.type === 'TB' && g.planes.length)));
        case 'buffAA': return own.slice();
        case 'buffArmor': return own.slice();
        case 'buffMove': return own.filter(u => u.cls !== 'SS' || u.move > 0);
        case 'smoke': return own.slice();
        case 'replenishAir': return own.filter(u => u.air && u.air.some(g => g.planes.length < (D.SHIP_DEFS[u.defId].air[g.type] || 0)));
        default: return own.slice();
      }
    }
    if (cmd.target === 'enemy') {
      if (cmd.effect === 'aswStrike') {
        return state.units.filter(u => u.side !== side && u.cls === 'SS' && isSubDetected(state, u, side));
      }
      return state.units.filter(u => u.side !== side && u.cls !== 'SS');
    }
    return [];
  }
  function playCommand(state, cardUid, targetUid) {
    if (state.finished || (state.phase !== 'action' && state.phase !== 'deploy')) return { ok: false, error: '当前不能使用指令卡' };
    const side = state.active;
    const p = state.players[side];
    if (p.commandUsed) return { ok: false, error: '本回合已经使用过指令卡' };
    const idx = p.hand.findIndex(c => c.uid === cardUid);
    if (idx < 0) return { ok: false, error: '手牌中没有这张卡' };
    const card = p.hand[idx];
    if (card.kind !== 'cmd') return { ok: false, error: '这不是指令卡' };
    const cmd = D.COMMAND_DEFS[card.defId];
    const cost = cmd.cost || 0;
    if (p.supply < cost) return { ok: false, error: '补给不足，无法使用「' + cmd.name + '」' };
    const target = targetUid != null ? getUnit(state, targetUid) : null;
    if (cmd.target !== 'none') {
      if (!target || target.side !== (cmd.target === 'own' ? side : otherSide(side))) return { ok: false, error: '需要选择正确目标' };
      if (!commandTargets(state, side, cmd).some(u => u.uid === target.uid)) return { ok: false, error: '目标不适用' };
    }
    let result = null;
    p.supply = Math.max(0, p.supply - cost);
    switch (cmd.effect) {
      case 'repair': {

      }
      case 'buffGun': target.buffs.gun = (target.buffs.gun || 0) + cmd.value; pushLog(state, side, '「' + cmd.name + '」：' + target.name + ' 主炮 +' + cmd.value + '。', 'cmd'); break;
      case 'buffTorp': target.buffs.torp = (target.buffs.torp || 0) + cmd.value; pushLog(state, side, '「' + cmd.name + '」：' + target.name + ' 鱼雷/舰载鱼雷 +' + cmd.value + '。', 'cmd'); break;
      case 'buffAA': target.buffs.aa = (target.buffs.aa || 0) + cmd.value; pushLog(state, side, '「' + cmd.name + '」：' + target.name + ' 防空 +' + cmd.value + '。', 'cmd'); break;
      case 'buffArmor': target.buffs.armor = (target.buffs.armor || 0) + cmd.value; pushLog(state, side, '「' + cmd.name + '」：' + target.name + ' 装甲 +' + cmd.value + '。', 'cmd'); break;
      case 'buffMove': target.buffs.move = (target.buffs.move || 0) + cmd.value; pushLog(state, side, '「' + cmd.name + '」：' + target.name + ' 移动 +' + cmd.value + '。', 'cmd'); break;

      case 'torpedo': {

        if (!res.sunk) {

        pushLog(state, side, '「' + cmd.name + '」：' + target.name + ' 受到 ' + info.final + ' 点伤害并进水。', 'cmd');
        result = res;
        break;
      }
      case 'airStrike': {
        const res = applyHp(state, target, cmd.value, side, 'command');
        if (!res.sunk) { target.fire += 1; }
        pushLog(state, side, '「' + cmd.name + '」：' + target.name + ' 受到 ' + cmd.value + ' 点伤害并起火。', 'cmd');
        result = res;
        break;
      }
      case 'heal': {
        const heal = Math.min(cmd.value, target.maxHp - target.hp);
        target.hp += heal;
        pushLog(state, side, '「' + cmd.name + '」：' + target.name + ' 回复 ' + heal + ' 点耐久。', 'cmd');
        break;
      }
      case 'ignite': {
        target.fire += cmd.value;
        pushLog(state, side, '「' + cmd.name + '」：' + target.name + ' 起火 +' + cmd.value + '（当前 ' + target.fire + ' 层）。', 'cmd');
        result = { fire: cmd.value };
        break;
      }
      case 'floodHit': {
        const sd = target.flood.port >= target.flood.starboard ? 'port' : 'starboard';
        target.flood[sd] += cmd.value;
        pushLog(state, side, '「' + cmd.name + '」：' + target.name + ' ' + (sd === 'port' ? '左舷' : '右舷') + '进水 +' + cmd.value + '。', 'cmd');
        if (Math.abs(target.flood.port - target.flood.starboard) > 3) {
          pushLog(state, side, target.name + ' 进水失衡，倾覆沉没！', 'sink');
          sinkUnit(state, target, side, '进水失衡');

        } else {
          result = { flood: cmd.value, side: sd };
        }
        break;
      }
      case 'supplyDrain': {
        const enemy = state.players[otherSide(side)];
        const before = enemy.supply;
        enemy.supply = Math.max(0, enemy.supply - cmd.value);
        pushLog(state, side, '「' + cmd.name + '」：敌方补给 -' + (before - enemy.supply) + '（' + enemy.supply + '/' + enemy.cap + '）。', 'cmd');
        result = { drained: before - enemy.supply };
        break;
      }
      case 'aswStrike': {
        const res = applyHp(state, target, cmd.value, side, 'command');
        if (!res.sunk) target.exposed = true;
        pushLog(state, side, '「' + cmd.name + '」：' + target.name + ' 受到 ' + cmd.value + ' 点深弹伤害' + (res.sunk ? '，被击沉！' : '，被迫上浮。'), 'cmd');
        result = res;
        break;
      }
      case 'replenishAir': {
        const added = replenishCarrierAir(target, cmd.value);
        pushLog(state, side, '「' + cmd.name + '」：' + target.name + ' 补充 ' + added + ' 架舰载机。', 'cmd');
        result = { added };
        break;
      }
      case 'yorktownSisters': {
        const ids = ['us_enterprise_egg', 'us_yorktown_egg', 'us_hornet_egg'];
        ids.forEach(id => p.hand.push({ uid: state.nextCardUid++, kind: 'ship', defId: id }));
        pushLog(state, side, '「约克城三姐妹」：企业、约克城、大黄蜂加入手牌！', 'cmd');
        result = { added: ids.length };
        break;
      }
      default: return { ok: false, error: '未实现的指令效果' };
    }
    p.hand.splice(idx, 1);
    p.discard.push(card);
    p.commandUsed = true;
    return { ok: true, effect: cmd.effect, target: target ? target.uid : null, result };
  }

  /* ---------------- 导出 ---------------- */
  return {
    DIRS, createGame, startTurn, beginAction, endTurn,
    unitsOf, getUnit, surfaceAt, subAt, ownSurfaceInRow, enemySurfaceInRow,
    isControlledRow, isDeployRow, airGroup, airAt,
    isValidDeployCell, deployCells, deploy, createUnit,
    canMove, moveTargets, moveUnit, turnUnit, canTurn,
    canFireMain, canFireSecondary, canFireTorp, canFireDepth, canFireAA,
    mainTargets, secondaryTargets, torpedoTargets, depthTargets, aaTargets, aaAttackValue,
    mainAttackInfo, secondaryAttackInfo, torpedoAttackInfo, gunInfo,
    fireMain, fireSecondary, fireTorpedo, fireDepth, fireAA,
    isSubDetected, visibleSubs, unknownSubRows, searchRow, reconRow,
    strikePathValid, computeCellAA, carrierStrike, combinedCarrierStrike,
    fighterMoveTargets, moveFighter, fighterAttackShip, fighterAttackAir,
    commandTargets, playCommand,
    applyHp, sinkUnit, checkVictory, finishGame, fleetStrength,

<script>
/* ============================================================
 * 钢铁潮汐 · AI v2
 * 移动+攻击 / 四向射界 / 主副炮 / 6 格空袭 / 新指令卡
 * ============================================================ */
(function (root, factory) {
  const Data = (typeof module === 'object' && module.exports) ? require('./data.js') : root.GameData;
  const Engine = (typeof module === 'object' && module.exports) ? require('./engine.js') : root.GameEngine;
  const api = factory(Data, Engine);
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.GameAI = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function (D, E) {
  'use strict';

  const other = E.otherSide;
  const isCapital = u => u.cls === 'BB' || u.cls === 'CV';
  const isHigh = u => u.cls === 'BB' || u.cls === 'CV' || u.cls === 'CA';
  const surfaceEnemies = (state, side) => state.units.filter(u => u.side !== side && u.cls !== 'SS');
  const visibleEnemies = (state, side) => state.units.filter(u => u.side !== side && (u.cls !== 'SS' || E.isSubDetected(state, u, side)));

  function cellScoreThreat(state, side, r, c) {
    let t = 0;
    state.units.forEach(e => {
      if (e.side === side) return;
      if (e.main && E.cellDist(r, c, e.r, e.c) <= e.main.range) t += e.main.damage * 0.45;
      if (e.secondary && E.cellDist(r, c, e.r, e.c) <= e.secondary.range) t += e.secondary.damage * 0.15;
      if (e.torpedo && E.cellDist(r, c, e.r, e.c) === 1) t += e.torpedo * 0.4;
      if (e.air && e.air.some(g => g.planes.length) && E.cellDist(r, c, e.r, e.c) <= D.MAX_PATH) t += 2;
    });
    return t;
  }

  function positionScore(state, unit, r, c) {
    const side = unit.side;
    let s = 0;
    const threat = cellScoreThreat(state, side, r, c);
    s -= threat * (unit.cls === 'DD' ? 0.4 : unit.cls === 'SS' ? 0.15 : 1.2);
    if (unit.cls === 'SS') {
      const asw = state.units.filter(u => u.side !== side && (u.cls === 'DD' || u.cls === 'CVE' || u.cls === 'SS') && u.r === r).length;
      s -= asw * 14;
      let best = null, bd = 99;
      state.units.forEach(e => {
        if (e.side === side) return;
        const d = E.cellDist(r, c, e.r, e.c);
        if (isHigh(e) && d < bd) { bd = d; best = e; }
      });
      if (best) { s -= bd * 3; if (bd === 1) s += 24; }
    } else if (unit.air) {
      const rear = side === 'A' ? r : 5 - r;
      s += Math.max(0, 3 - rear) * 5;
      let inRange = 0;
      surfaceEnemies(state, side).forEach(e => { if (E.cellDist(r, c, e.r, e.c) <= D.MAX_PATH) inRange++; });
      s += inRange * 3;
    } else {
      const ideal = side === 'A' ? 2 : 3;
      s -= Math.abs(r - ideal) * 2.2;
      if (unit.cls === 'DD') {
        let best = null, bd = 99;
        state.units.forEach(e => {
          if (e.side === side) return;
          const d = E.cellDist(r, c, e.r, e.c);
          if (isHigh(e) && d < bd) { bd = d; best = e; }
        });
        if (best) { s -= bd * 2; if (bd === 1) s += 14; }
      }
    }
    const crowd = state.units.filter(u => u.side === side && u.cls !== 'SS' && u.r === r && u.c === c).length;
    s -= crowd * 4;
    return s;
  }

  /* ---------------- 部署 ---------------- */
  function deployScore(state, side, def, r, c) {
    let s = 8 + def.points * 0.9;
    if (def.cls === 'BB') s += 26;
    if (def.cls === 'CV') s += 30;
    if (def.cls === 'CA') s += 14;
    if (def.cls === 'CL') s += 11;
    if (def.cls === 'DD') s += 8;
    if (def.cls === 'SS') s += 7;
    if (def.cls === 'CV') {
      const rear = side === 'A' ? r : 5 - r;
      s += rear * 6;
      if (rear >= 2) s -= 26;
      if (c === 1 || c === 2 || c === 3) s += 3;
    } else if (def.cls === 'BB') {
      const rear = side === 'A' ? r : 5 - r;
      s += Math.max(0, 2 - rear) * 6;
      if (c === 1 || c === 2 || c === 3) s += 2;
    } else if (def.cls === 'DD') {
      const advance = side === 'A' ? r : 5 - r;
      s += advance * 3;
      if (c === 0 || c === 4) s += 4;
    } else if (def.cls === 'SS') {
      const advance = side === 'A' ? r : 5 - r;
      s += advance * 2;
      if (c === 0 || c === 4) s += 5;
      if (state.units.some(u => u.side !== side && (u.cls === 'DD' || u.cls === 'CVE') && u.r === r)) s -= 20;
    } else {
      const advance = side === 'A' ? r : 5 - r;
      s += advance * 2;
      if (c === 1 || c === 2 || c === 3) s += 2;
    }
    s -= cellScoreThreat(state, side, r, c) * (isCapital(def) ? 1.8 : 0.7);
    return s;
  }

  function pickDeploy(state, side) {
    const p = state.players[side];
    const ships = p.hand.filter(c => c.kind === 'ship' && D.SHIP_DEFS[c.defId].cost <= p.supply);
    if (!ships.length) return null;
    let best = null;
    ships.forEach(card => {
      const def = D.SHIP_DEFS[card.defId];
      E.deployCells(state, side, card).forEach(cell => {
        const s = deployScore(state, side, def, cell.r, cell.c);
        if (!best || s > best.score) best = { card, r: cell.r, c: cell.c, score: s };
      });
    });
    return best && best.score > 6 ? best : null;
  }

  /* ---------------- 空袭 ---------------- */
  function enumeratePaths(state, carrier) {
    const out = [];
    const start = { r: carrier.r, c: carrier.c };
    const seen = { [start.r + ',' + start.c]: true };
    const path = [];
    function dfs() {
      if (path.length) out.push(path.slice());
      if (path.length >= D.MAX_PATH) return;
      const last = path.length ? path[path.length - 1] : start;
      E.DIRS.forEach(d => {
        const nr = last.r + d[0], nc = last.c + d[1], k = nr + ',' + nc;
        if (!E.inBounds(nr, nc) || seen[k]) return;
        seen[k] = true; path.push({ r: nr, c: nc });
        dfs();
        path.pop(); seen[k] = false;
      });
    }
    dfs();
    return out;
  }

  function simStrike(state, carrier, type, path) {
    const group = E.airGroup(carrier, type);
    if (!group || !group.planes.length) return null;
    const target = path[path.length - 1];
    const defender = other(carrier.side);
    const targetShip = state.units.find(u => u.side === defender && u.cls !== 'SS' && u.r === target.r && u.c === target.c) || null;
    const friendly = state.units.find(u => u.side === carrier.side && u.cls !== 'SS' && u.r === target.r && u.c === target.c) || null;
    if (type === 'F') {
      if (!targetShip && !friendly && !state.airUnits.some(a => a.side === defender && a.r === target.r && a.c === target.c)) return null;
    } else if (!targetShip) return null;
    const fighters = state.airUnits.filter(a => a.side === defender && a.type === 'F' && a.r === target.r && a.c === target.c);
    const hasDF = fighters.length > 0;
    const planes = group.planes.map(p => ({ hp: p.hp, cap: 0, dead: false }));
    let losses = 0;
    path.forEach((cell, i) => {
      const isTarget = i === path.length - 1;
      const aa = E.computeCellAA(state, cell.r, cell.c, defender, target.r, target.c, hasDF && isTarget);
      planes.forEach(p => {
        if (p.dead) return;
        const d = Math.min(3 - p.cap, aa.per);
        p.cap += d; p.hp -= d;
        if (p.hp <= 0) { p.dead = true; losses++; }
      });
    });
    const alive = planes.filter(p => !p.dead);
    if (!alive.length) return { score: -9999, path, type, losses, damage: 0, survivors: 0 };
    let damage = 0, fire = 0, flood = 0;
    if (type === 'DB') { damage = alive.length * 2; if (damage >= 5) fire = 1; }
    if (type === 'TB') {
      let raw = alive.length * 3 + (carrier.buffs.torp || 0);
      damage = targetShip ? Math.max(1, raw - targetShip.bulkhead) : raw;
      flood = damage >= 8 ? 2 : 1;
    }
    let score = 0;
    if (type === 'F') {
      const enemyAir = state.units.some(e => e.side === defender && e.air && e.air.some(g => g.planes.length));
      if (targetShip) {
        score = alive.length * 3 + targetShip.points * 0.15 - losses * 8;
        if (hasDF) score += 6;
      } else if (friendly) {
        score = enemyAir ? 10 + (isCapital(friendly) ? 8 : 0) - losses * 10 : -4;
      }
    } else {
      score = damage * 10 + targetShip.points * 0.4;
      if (damage >= targetShip.hp) score += targetShip.points * 12 + 26;
      if (targetShip.cls === 'BB' || targetShip.cls === 'CV') score += 8;
      score += fire * 8 + flood * 10;
      score -= losses * 15;
      if (hasDF) score -= Math.min(alive.length, Math.ceil(fighters.reduce((s, a) => s + a.planes.length, 0) * 0.6)) * 10;
      if (type === 'TB') score += 2;

  }

  function bestStrike(state, carrier) {
    let best = null;
    ['TB', 'DB', 'F'].forEach(type => {
      const g = E.airGroup(carrier, type);

      enumeratePaths(state, carrier).forEach(path => {

  }

  /* ---------------- 攻击计划 ---------------- */
  function attackValue(target, dmg, type) {

    if (type === 'torp') s += 6;

  }

  function planFor(state, unit, r, c, heading) {
    const fake = Object.assign({}, unit, {

    if (unit.air) {
      const strike = bestStrike(state, fake);
      return { strike: strike && strike.score > 0 ? strike : null, score: strike && strike.score > 0 ? strike.score : 0, main: null, secondary: null, torps: [], depth: null, aa: null };
    }
    let main = null, secondary = null, depth = null, aa = null;
    const torps = [];
    E.mainTargets(state, fake).forEach(t => {
      const info = E.mainAttackInfo(fake, t);
      if (!info || info.final <= 0) return;
      let fire = info.final >= 8 ? 2 : info.final >= 5 ? 1 : 0;
      const s = attackValue(t, info.final, 'main') + fire * 6;
      if (!main || s > main.score) main = { target: t, final: info.final, info, score: s, fire };
    });
    E.secondaryTargets(state, fake).forEach(t => {
      if (main && main.target.uid === t.uid && main.final >= t.hp) return;
      const info = E.secondaryAttackInfo(fake, t);
      if (!info || info.final <= 0) return;
      const s = attackValue(t, info.final, 'secondary');
      if (!secondary || s > secondary.score) secondary = { target: t, final: info.final, info, score: s };
    });
    const torpSides = unit.cls === 'SS' ? ['fore'] : ['port', 'starboard'];
    torpSides.forEach(side => {
      E.torpedoTargets(state, fake, side).forEach(t => {
        const info = E.torpedoAttackInfo(fake, t);
        const flood = info.final >= 8 ? 2 : 1;

        if (!existing || s > existing.score) {

          const idx = torps.findIndex(x => x.side === side);

    });
    E.depthTargets(state, fake).forEach(t => {

    }

  }

  function choosePlan(state, unit) {
    const candidates = [];
    const moves = E.moveTargets(state, unit);
    const dests = [{ r: unit.r, c: unit.c, move: false }];
    moves.forEach(t => dests.push({ r: t.r, c: t.c, move: true }));
    dests.forEach(d => {
      const plan = planFor(state, unit, d.r, d.c, unit.heading);
      const pos = positionScore(state, unit, d.r, d.c);
      const total = plan.score + pos * 2 - (d.move ? 1 : 0);
      candidates.push({ r: d.r, c: d.c, heading: unit.heading, move: d.move, plan, pos, total });
    });

  function executePlan(state, unit, choice, onEvent) {
    const events = [];
    if (choice.move) {

    if (p.secondary) {
      const t = p.secondary.target;
      if (t.hp > 0 && state.units.includes(t)) {
        const r = E.fireSecondary(state, unit.uid, t.uid);
        if (r.ok) events.push({ type: 'secondary', unit, target: t, result: r });
      }
    }
    (p.torps || []).forEach(torp => {
      const t = torp.target;
      if (t && t.hp > 0 && state.units.includes(t)) {
        const r = E.fireTorpedo(state, unit.uid, t.uid, torp.side);
        if (r.ok) events.push({ type: 'torp', unit, target: t, side: torp.side, result: r });
      }
    });
    if (p.depth) {
      const t = p.depth.target;
      if (state.units.includes(t)) {
        const r = E.fireDepth(state, unit.uid, t.uid);
        if (r.ok) events.push({ type: 'depth', unit, target: t, result: r });
      }
    }
    if (p.aa) {
      const a = p.aa.targetAir;
      if (a && state.airUnits.includes(a) && a.planes.length) {
        const r = E.fireAA(state, unit.uid, a.uid);
        if (r.ok) events.push({ type: 'aa', unit, targetAir: a, result: r });
      }
    }
    if (p.strike) {
      const r = E.carrierStrike(state, unit.uid, p.strike.type, p.strike.path);
      if (r.ok) events.push({ type: 'strike', unit, result: r });
    }
    return events;
  }

  /* ---------------- 指令卡 ---------------- */
  function combatCommand(state, side) {
    const p = state.players[side];
    if (p.commandUsed) return null;
    const cmds = p.hand.filter(c => c.kind === 'cmd');
    if (!cmds.length) return null;
    const own = E.unitsOf(state, side);
    let best = null;
    cmds.forEach(card => {
      const cmd = D.COMMAND_DEFS[card.defId];
      if ((cmd.cost || 0) > p.supply) return;
      let value = 0, target = null;
      if (cmd.effect === 'repair') {
        const t = own.filter(u => u.fire > 0 || u.flood.port + u.flood.starboard > 0)
          .sort((a, b) => (b.fire * 3 + b.flood.port + b.flood.starboard) - (a.fire * 3 + a.flood.port + a.flood.starboard))[0];
        if (t) { target = t; value = 12 + t.fire * 4 + (t.flood.port + t.flood.starboard) * 3; }
      } else if (cmd.effect === 'repairAll') {
        const n = own.filter(u => u.fire > 0 || u.flood.port + u.flood.starboard > 0).length;
        if (n >= 2) { value = n * 8; }
      } else if (cmd.effect === 'buffGun') {
        const t = own.filter(u => u.main && E.mainTargets(state, u).length).sort((a, b) => b.points - a.points)[0];
        if (t) { target = t; value = 12; }
      } else if (cmd.effect === 'buffTorp') {
        const t = own.filter(u => (u.torpedo && E.torpedoTargets(state, u).length) || (u.air && u.air.some(g => g.type === 'TB' && g.planes.length))).sort((a, b) => b.points - a.points)[0];
        if (t) { target = t; value = 12; }
      } else if (cmd.effect === 'buffArmor') {
        const t = own.filter(isCapital).sort((a, b) => b.points - a.points)[0];
        if (t) { target = t; value = 10; }
      } else if (cmd.effect === 'buffAA') {
        const t = own.filter(isCapital).sort((a, b) => b.points - a.points)[0];
        const enemyAir = state.units.some(u => u.side !== side && u.air && u.air.some(g => g.planes.length));
        if (t && enemyAir) { target = t; value = 12; }
      } else if (cmd.effect === 'smoke') {
        const t = own.filter(isCapital).sort((a, b) => b.points - a.points)[0];
        if (t) {
          const guns = state.units.filter(e => e.side !== side && e.main && E.dist(e, t) <= e.main.range).length;
          if (guns >= 2) { target = t; value = 16; }
        }
      } else if (cmd.effect === 'disableMove' || cmd.effect === 'disableAttack') {
        const t = state.units.filter(u => u.side !== side && isCapital(u)).sort((a, b) => b.points - a.points)[0];
        if (t) { target = t; value = cmd.effect === 'disableAttack' ? 20 : 14; }
      } else if (cmd.effect === 'airStrike') {
        const t = state.units.filter(u => u.side !== side && u.cls !== 'SS').sort((a, b) => (b.points + b.hp) - (a.points + a.hp))[0];
        if (t) { target = t; value = 16; }
      } else if (cmd.effect === 'torpedo') {
        const t = state.units.filter(u => u.side !== side && u.cls !== 'SS').sort((a, b) => b.points - a.points)[0];
        if (t) { target = t; value = 18; }
      } else if (cmd.effect === 'buffMove') {
        const t = own.filter(u => !u.moved && (u.cls === 'DD' || u.cls === 'SS' || isCapital(u)))
          .sort((a, b) => (b.points + (b.cls === 'DD' ? 8 : 0)) - (a.points + (a.cls === 'DD' ? 8 : 0)))[0];
        if (t) { target = t; value = 12; }
      } else if (cmd.effect === 'reveal') {
        if (E.unknownSubRows(state, side).length) value = 11;
      } else if (cmd.effect === 'ignite' || cmd.effect === 'floodHit') {
        const t = state.units.filter(u => u.side !== side && u.cls !== 'SS')
          .sort((a, b) => (b.points + (cmd.effect === 'ignite' ? b.fire * 2 : 0)) - (a.points + (cmd.effect === 'ignite' ? a.fire * 2 : 0)))[0];
        if (t) { target = t; value = cmd.effect === 'floodHit' ? 22 : 18; }
      } else if (cmd.effect === 'supplyDrain') {
        const enemy = state.players[E.otherSide(side)];
        if (enemy.supply >= 2) value = 16;
      } else if (cmd.effect === 'aswStrike') {
        const t = state.units.filter(u => u.side !== side && u.cls === 'SS' && E.isSubDetected(state, u, side))[0];
        if (t) { target = t; value = 20; }
      } else if (cmd.effect === 'replenishAir') {
        const t = own.filter(u => u.air && u.air.some(g => g.planes.length < (D.SHIP_DEFS[u.defId].air[g.type] || 0)))
          .sort((a, b) => b.points - a.points)[0];
        if (t) { target = t; value = 14; }
      } else if (cmd.effect === 'heal') {
        const t = own.filter(u => u.hp < u.maxHp).sort((a, b) => (b.maxHp - b.hp) - (a.maxHp - a.hp))[0];
        if (t) { target = t; value = 10; }
      }
      if (value > 0 && (!best || value > best.value)) best = { card, cmd, target, value };
    });
    return best && best.value >= 12 ? best : null;
  }

  function deployCommand(state, side) {
    const p = state.players[side];
    if (p.commandUsed) return null;
    const cmds = p.hand.filter(c => c.kind === 'cmd');
    let best = null;
    cmds.forEach(card => {
      const cmd = D.COMMAND_DEFS[card.defId];
      if ((cmd.cost || 0) > p.supply) return;
      let value = 0;
      if (cmd.effect === 'supply') {
        if (p.supply >= p.cap) return;
        const ships = p.hand.filter(c => c.kind === 'ship' && D.SHIP_DEFS[c.defId].cost > p.supply && D.SHIP_DEFS[c.defId].cost <= Math.min(p.cap, p.supply + cmd.value));
        if (ships.length) value = 22;
      } else if (cmd.effect === 'draw') {
        if (p.hand.length <= 5) value = 12;
      }
      if (value > 0 && (!best || value > best.value)) best = { card, cmd, target: null, value };
    });
    return best && best.value >= 12 ? best : null;
  }

  function reconChoice(state, side) {
    const p = state.players[side];
    if (p.reconUsed) return null;
    const unknown = E.unknownSubRows(state, side);
    if (!unknown.length) return null;
    return unknown[0];
  }

  /* ---------------- 回合 ---------------- */
  async function playTurn(state, side, opts) {
    opts = opts || {};
    const sleep = opts.sleep || (() => Promise.resolve());
    const onChange = opts.onChange || (() => {});
    const onEvent = opts.onEvent || (() => {});
    if (!state || state.finished || state.active !== side) return;
    if (state.phase !== 'action') return;
    let guard = 0;

    // 部署阶段：先部署，再视情况用补给指令继续部署
    let usedDeployCmd = false;
    for (let i = 0; i < 5; i++) {
      if (state.finished) return;
      const pick = pickDeploy(state, side);
      if (!pick) {
        if (!usedDeployCmd) {
          const pre = deployCommand(state, side);
          if (pre) {
            const r = E.playCommand(state, pre.card.uid, null);
            if (r.ok) {
              usedDeployCmd = true;
              await onEvent({ type: 'command', plan: pre });
              onChange();
              await sleep(260);
              continue;
            }
          }
        }
        break;
      }
      const res = E.deploy(state, pick.card.uid, pick.r, pick.c);
      if (!res.ok) break;
      state.lastActor = res.unit.uid;
      await onEvent({ type: 'deploy', unit: res.unit });
      onChange();
      await sleep(300);
      if (++guard > 40) break;
    }
    if (state.finished) return;
    onChange();
    await sleep(200);

    const row = reconChoice(state, side);
    if (row != null) {
      const r = E.reconRow(state, row);
      if (r.ok) { await onEvent({ type: 'recon', row }); onChange(); await sleep(220); }
    }

    const cmd = combatCommand(state, side);
    if (cmd) {
      const r = E.playCommand(state, cmd.card.uid, cmd.target ? cmd.target.uid : null);
      if (r.ok) { await onEvent({ type: 'command', plan: cmd }); onChange(); await sleep(280); }
    }

    const order = { CV: 0, BB: 1, CA: 2, CL: 3, DD: 4, SS: 5 };
    const units = E.unitsOf(state, side).slice().sort((a, b) => {
      const d = (order[a.cls] == null ? 9 : order[a.cls]) - (order[b.cls] == null ? 9 : order[b.cls]);
      return d !== 0 ? d : b.points - a.points;
    });
    for (const unit of units) {
      if (state.finished) break;
      if (unit.hp <= 0) continue;
      const plan = choosePlan(state, unit);
      if (!plan) continue;
      state.lastActor = unit.uid;
      const events = executePlan(state, unit, plan, onEvent);
      for (const ev of events) {
        await onEvent(ev);
        onChange();
        await sleep(ev.type === 'strike' ? 600 : 360);
      }
      if (++guard > 100) break;
    }
    if (!state.finished) E.endTurn(state);
    state.lastActor = null;
    onChange();
  }

  return { playTurn, pickDeploy, choosePlan, bestStrike, enumeratePaths, simStrike,
    positionScore, cellScoreThreat, deployScore, combatCommand, deployCommand, reconChoice };
});
