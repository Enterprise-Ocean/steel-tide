      <div class="fire-sub">所有选中机队只承受一次目标格防空；不同航母/机型可混合。</div>
      <div class="combined-list">${rows}</div>
      <div class="fire-row"><label>目标</label><select class="combined-target">${opts}</select></div>
      <div class="fire-actions"><button class="act-btn ghost" data-close="1">取消</button><button class="act-btn gold" data-combined="1">出击</button></div>
    </div>`;
    document.getElementById('modalRoot').appendChild(wrap);
    modalEl = wrap;
    wrap.addEventListener('click', e => {
      if (e.target === wrap || e.target.dataset.close) { closeModal(); return; }
      if (e.target.closest('[data-combined]')) {
        const picks = [];
        wrap.querySelectorAll('input[data-carrier]:checked').forEach(cb => {
          picks.push({ carrierUid: parseInt(cb.dataset.carrier, 10), type: cb.dataset.type });
        });
        const targetUid = parseInt(wrap.querySelector('.combined-target').value, 10);
        if (!picks.length) { toast('至少选择一个机队'); return; }
        closeModal();
        onConfirm(picks, targetUid);
      }
    });
  }

  function openHeadingPanel(unit, onConfirm) {
    const wrap = document.createElement('div');
    wrap.className = 'modal-wrap show';
    wrap.innerHTML = `<div class="end-card" style="width:min(420px,90vw)">
      <div class="end-kicker">HEADING</div>
      <div style="font-family:var(--serif);font-size:24px;color:var(--gold-2);margin:8px 0 6px">${h(unit.name)} · 转向</div>
      <div style="font-size:10px;color:var(--muted);margin-bottom:14px">当前舰首：${HEAD_NAME[unit.heading]}。转向消耗 ${unit.turnCost} 行动点（当前 ${unit.ap}/${unit.apMax}）；转向后本回合只能开火、不能移动，开火按转向前的炮位结算。</div>
      <div class="heading-grid">
        <button class="act-btn" data-head="N">↑ 北</button>
        <button class="act-btn" data-head="W">← 西</button>
        <button class="act-btn" data-head="E">东 →</button>
        <button class="act-btn" data-head="S">↓ 南</button>
      </div>
      <div style="text-align:right;margin-top:12px"><button class="act-btn ghost" data-close="1">取消</button></div>
    </div>`;
    document.getElementById('modalRoot').appendChild(wrap);
    modalEl = wrap;
    wrap.addEventListener('click', e => {
      if (e.target === wrap || e.target.dataset.close) { closeModal(); return; }
      const b = e.target.closest('[data-head]');
      if (b) { closeModal(); onConfirm(b.dataset.head); }
    });
  }

  function pickSquadron(carrier, cb) {
    const groups = carrier.air || [];
    const wrap = document.createElement('div');
    wrap.className = 'modal-wrap show';
    wrap.innerHTML = `<div class="end-card" style="width:min(460px,90vw);text-align:left">
      <div class="end-kicker">AIR OPERATION</div>
      <div style="font-family:var(--serif);font-size:24px;color:var(--gold-2);letter-spacing:.1em;margin:8px 0 4px">${h(carrier.name)} · 选择出击中队</div>
      <div style="font-size:10px;color:var(--muted);line-height:1.7;margin-bottom:16px">航程 6 格，逐格规划。鱼雷机造成进水，俯冲轰炸机造成起火；战斗机可缠斗/压制/护航。</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${groups.map(g => {
          const info = D.PLANE_INFO[g.type], n = g.planes.length;
          return `<button class="act-btn" data-type="${g.type}" ${n ? '' : 'disabled'} style="height:46px;text-align:left;padding:0 14px">
            <b style="color:var(--gold-2);font-family:var(--serif);font-size:14px">${info.name} ${g.type}</b>
            <span style="float:right;color:var(--muted)">${n} 架 · ${info.atk} 攻 / ${info.hp} HP</span></button>`;
        }).join('')}
      </div>
      <div style="margin-top:16px;text-align:right"><button class="act-btn ghost" data-close="1">取消</button></div>
    </div>`;
    document.getElementById('modalRoot').appendChild(wrap);
    modalEl = wrap;
    wrap.addEventListener('click', e => {
      if (e.target === wrap || e.target.dataset.close) { closeModal(); return; }
      const b = e.target.closest('[data-type]');
      if (b && !b.disabled) { closeModal(); cb(b.dataset.type); }
    });
  }

  function confirmBox(title, text, onYes) {
    const wrap = document.createElement('div');
    wrap.className = 'modal-wrap show';
    wrap.innerHTML = `<div class="end-card" style="width:min(440px,90vw)">
      <div class="end-kicker">CONFIRM</div>
      <div style="font-family:var(--serif);font-size:24px;color:var(--gold-2);margin:10px 0 8px">${h(title)}</div>
      <div style="font-size:11px;color:var(--muted);line-height:1.8">${h(text)}</div>
      <div class="end-actions"><button class="big-btn" data-yes="1">确认</button><button class="big-btn ghost" data-close="1">取消</button></div>
    </div>`;
    document.getElementById('modalRoot').appendChild(wrap);
    modalEl = wrap;
    wrap.addEventListener('click', e => {
      if (e.target === wrap || e.target.dataset.close) { closeModal(); return; }
      if (e.target.dataset.yes) { closeModal(); onYes(); }
    });
  }

  /* ---------------- 动效 ---------------- */
  function floatAt(r, c, text, cls) {
    const cell = cellEl(r, c); if (!cell) return;
    const d = document.createElement('div'); d.className = 'dmg-float ' + (cls || ''); d.textContent = text;
    cell.appendChild(d); setTimeout(() => d.remove(), 1050);
  }
  function impact(r, c, big) {
    const cell = cellEl(r, c); if (!cell) return;
    const f = document.createElement('div'); f.className = 'hit-flash'; cell.appendChild(f);
    cell.classList.add('shake'); setTimeout(() => { f.remove(); cell.classList.remove('shake'); }, 500);
    if (big) { const rp = document.createElement('div'); rp.className = 'ripple'; cell.appendChild(rp); setTimeout(() => rp.remove(), 750); }
  }
  function tracer(from, to, cls) {
    const svg = document.getElementById('pathLayer');
    const br = boardRect(), sr = shellRect();
    svg.style.left = (br.left - sr.left) + 'px'; svg.style.top = (br.top - sr.top) + 'px';
    svg.style.width = br.width + 'px'; svg.style.height = br.height + 'px';
    svg.setAttribute('viewBox', `0 0 ${br.width} ${br.height}`); svg.innerHTML = '';
    const fc = cellEl(from.r, from.c), tc = cellEl(to.r, to.c); if (!fc || !tc) return;
    const fr = fc.getBoundingClientRect(), tr = tc.getBoundingClientRect();
    const x1 = fr.left - br.left + fr.width / 2, y1 = fr.top - br.top + fr.height / 2;
    const x2 = tr.left - br.left + tr.width / 2, y2 = tr.top - br.top + tr.height / 2;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1); line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('stroke', cls === 'torp' ? 'rgba(150,220,235,.9)' : 'rgba(240,190,120,.95)');
    line.setAttribute('stroke-width', '1.6');
    line.setAttribute('stroke-dasharray', cls === 'torp' ? '3 5' : '7 3');
    line.style.filter = 'drop-shadow(0 0 3px rgba(240,190,120,.6))';
    svg.appendChild(line); setTimeout(() => { if (svg.contains(line)) line.remove(); }, 500);
  }

  async function playEvent(ev) {
    if (!ev) return;
    const delay = fast ? 0.45 : 1;
    if (ev.type === 'main' || ev.type === 'secondary') {
      if (ev.unit && ev.target) tracer(ev.unit, ev.target, 'gun');
      Sound.play('gun');
      await sleep(120 * delay);
      if (ev.target) { impact(ev.target.r, ev.target.c, ev.result && ev.result.sunk); floatAt(ev.target.r, ev.target.c, '-' + (ev.result.damage || 0)); }
      if (ev.result && ev.result.fire) floatAt(ev.target.r, ev.target.c, '起火', 'aa');
      if (ev.result && ev.result.sunk) { Sound.play('sink'); floatAt(ev.target.r, ev.target.c, '击沉', 'aa'); }
      await sleep(180 * delay);
    } else if (ev.type === 'torp') {
      if (ev.unit && ev.target) tracer(ev.unit, ev.target, 'torp');
      Sound.play('torp'); await sleep(280 * delay);
      if (ev.target) { impact(ev.target.r, ev.target.c, ev.result && ev.result.sunk); floatAt(ev.target.r, ev.target.c, '-' + (ev.result.damage || 0)); }
      if (ev.result && ev.result.flood) floatAt(ev.target.r, ev.target.c, '进水 +' + ev.result.flood, 'aa');
      if (ev.result && ev.result.sunk) { Sound.play('sink'); floatAt(ev.target.r, ev.target.c, '击沉', 'aa'); }
      await sleep(200 * delay);
    } else if (ev.type === 'depth') {
      Sound.play('depth');
      if (ev.target) {
        const cell = cellEl(ev.target.r, ev.target.c);
        if (cell) for (let i = 0; i < 3; i++) {
          const rp = document.createElement('div'); rp.className = 'ripple'; rp.style.animationDelay = (i * 0.12) + 's';
          cell.appendChild(rp); setTimeout(() => rp.remove(), 900);
        }
        await sleep(280 * delay); impact(ev.target.r, ev.target.c, ev.result && ev.result.sunk);
        floatAt(ev.target.r, ev.target.c, '-' + (ev.result.damage || 0));
      }
      await sleep(220 * delay);
    } else if (ev.type === 'strike') {
      await animateStrike(ev);
    } else if (ev.type === 'move') {
      Sound.play('click');
      if (ev.result && ev.result.to) {
        const cell = cellEl(ev.result.to.r, ev.result.to.c);
        if (cell) { const rp = document.createElement('div'); rp.className = 'ripple'; rp.style.borderColor = 'rgba(127,211,168,.9)'; cell.appendChild(rp); setTimeout(() => rp.remove(), 800); }
        await sleep(180 * delay);
      }
    } else if (ev.type === 'turn') {
      Sound.play('click');
      if (ev.unit) { const cell = cellEl(ev.unit.r, ev.unit.c); if (cell) { cell.classList.add('shake'); setTimeout(() => cell.classList.remove('shake'), 300); } }
      await sleep(160 * delay);
    } else if (ev.type === 'deploy') {
      Sound.play('click');
      if (ev.unit) { const cell = cellEl(ev.unit.r, ev.unit.c); if (cell) { const rp = document.createElement('div'); rp.className = 'ripple'; rp.style.borderColor = 'rgba(127,211,168,.9)'; cell.appendChild(rp); setTimeout(() => rp.remove(), 800); } }
      await sleep(200 * delay);
    } else if (ev.type === 'recon') {
      Sound.play('aa');
      for (let c = 0; c < D.BOARD_COLS; c++) {
        const cell = cellEl(ev.row, c);
        if (cell) { cell.classList.add('recon-row'); setTimeout(() => cell.classList.remove('recon-row'), 500); }
      }
      await sleep(240 * delay);
    } else if (ev.type === 'command') {
      Sound.play('click');
      if (ev.plan && ev.plan.target) { floatAt(ev.plan.target.r, ev.plan.target.c, '指令', 'heal'); impact(ev.plan.target.r, ev.plan.target.c, false); }
      await sleep(240 * delay);
    } else if (ev.type === 'search') {
      Sound.play('aa'); await sleep(180 * delay);
    }
  }

  async function animateStrike(ev) {
    const delay = fast ? 0.4 : 1;
    const res = ev.result || ev; if (!res || !res.path) return;
    const carrier = ev.unit;
    const svg = document.getElementById('pathLayer');
    const br = boardRect(), sr = shellRect();
    svg.style.left = (br.left - sr.left) + 'px'; svg.style.top = (br.top - sr.top) + 'px';
    svg.style.width = br.width + 'px'; svg.style.height = br.height + 'px';
    svg.setAttribute('viewBox', `0 0 ${br.width} ${br.height}`); svg.innerHTML = '';
    const pts = [{ r: carrier.r, c: carrier.c }].concat(res.path).map(p => { const cc = cellCenter(p.r, p.c); return `${cc.x},${cc.y}`; });
    const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    poly.setAttribute('points', pts.join(' ')); poly.setAttribute('fill', 'none');
    poly.setAttribute('stroke', 'rgba(233,207,154,.8)'); poly.setAttribute('stroke-width', '1.4'); poly.setAttribute('stroke-dasharray', '4 4');
    svg.appendChild(poly);
    const start = cellCenter(carrier.r, carrier.c);
    const ghost = document.createElement('div'); ghost.className = 'plane-ghost';
    ghost.style.left = (start.x - 14) + 'px'; ghost.style.top = (start.y - 14) + 'px';
    ghost.textContent = res.type + '×' + res.startPlanes;
    document.querySelector('.board-shell').appendChild(ghost);
    Sound.play('plane'); await sleep(200 * delay);
    for (let i = 0; i < res.path.length && i < res.steps.length; i++) {
      const p = res.path[i], step = res.steps[i] || {};
      const cc = cellCenter(p.r, p.c); ghost.style.left = (cc.x - 14) + 'px'; ghost.style.top = (cc.y - 14) + 'px';
      await sleep(290 * delay);
      if (step.aa > 0) {
        Sound.play('aa');
        const cell = cellEl(p.r, p.c);
        if (cell) { const rp = document.createElement('div'); rp.className = 'ripple'; rp.style.borderColor = 'rgba(240,210,120,.9)'; cell.appendChild(rp); setTimeout(() => rp.remove(), 700); }
        floatAt(p.r, p.c, '防空 ' + step.aa); await sleep(120 * delay);
      }
      if (step.losses > 0) { floatAt(p.r, p.c, '-' + step.losses + ' 架', 'aa'); ghost.textContent = '×' + step.alive; await sleep(100 * delay); }
    }
    if (res.shipDamage) {
      impact(res.targetCell.r, res.targetCell.c, res.sunk);
      floatAt(res.targetCell.r, res.targetCell.c, '-' + res.shipDamage); Sound.play('boom');
      if (res.fire) floatAt(res.targetCell.r, res.targetCell.c, '起火', 'aa');
      if (res.flood) floatAt(res.targetCell.r, res.targetCell.c, '进水', 'aa');
      await sleep(240 * delay);
    }
    if (res.sunk) { floatAt(res.targetCell.r, res.targetCell.c, '击沉', 'aa'); Sound.play('sink'); await sleep(200 * delay); }
    ghost.remove(); svg.innerHTML = ''; await sleep(120 * delay);
  }

  /* ---------------- 导出 ---------------- */
  window.UI = {
    init, render, resetLog, showStart, hideOverlay, showEnd, showRules,
    showDeckBuilder, closeModal, pickSquadron, confirmBox, openFirePanel, openAntiAirPanel, openHeadingPanel, openCombinedStrikePanel, showInfoPanel, showShipInfo, showCardInfo,
    toast, playEvent, Sound,
    get soundOn() { return soundOn; },
    setSpeed(f) { fast = !!f; },
    hideTooltip
  };
})();


























</script>
<script>
/* ============================================================
 * 钢铁潮汐 · 控制器 v2
 * ============================================================ */
(function () {
  'use strict';
  const D = window.GameData;
  const E = window.GameEngine;
  const AI = window.GameAI;
  const UI = window.UI;

  const app = {
    state: null,
    human: 'A',
    ai: 'B',
    busy: false,
    aiScheduled: false,
    gameId: 0,
    playerSide: 'Allies',
    decks: { Allies: D.cloneDeck(D.STARTER_DECKS.Allies), Axis: D.cloneDeck(D.STARTER_DECKS.Axis) },
    selectedUid: null,
    selectedCardUid: null,
    selectedAirUid: null,
    mode: null,
    airType: null,
    airCarrierUid: null,
    path: [],
    speed: 1,
    demo: false,
    pendingEnd: false,
    endTimer: null
  };

  const params = new URLSearchParams(location.search);
  if (params.get('fast') === '1') app.speed = 3;
  if (params.get('demo') === '1') app.demo = true;

  const DECK_KEY = 'steelTide.decks.v2';

  function loadDecks() {
    try {
      const raw = localStorage.getItem(DECK_KEY);
      if (!raw) return;
      const obj = JSON.parse(raw);
      ['Allies', 'Axis'].forEach(side => {
        if (obj[side] && D.validateDeck(obj[side]).length === 0) app.decks[side] = D.cloneDeck(obj[side]);
      });
    } catch (e) { /* ignore */ }
  }
  function saveDecks() {
    try { localStorage.setItem(DECK_KEY, JSON.stringify(app.decks)); } catch (e) { /* ignore */ }
  }

  function key(r, c) { return r + ',' + c; }
  function otherSide(s) { return s === 'A' ? 'B' : 'A'; }
  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  /* ---------------- 视图 ---------------- */
  function makeView() {
    const v = {
      humanSide: app.human, busy: app.busy || app.aiScheduled,
      selectedUid: app.selectedUid, selectedCardUid: app.selectedCardUid,
      selectedAirUid: app.selectedAirUid,
      mode: app.mode, airType: app.airType, airCarrierUid: app.airCarrierUid,
      path: app.path.slice(), validCells: [], targetUids: [], reconRows: [],
      strikeTargetOk: false
    };
    if (!app.state) return v;
    const s = app.state;
    const p = s.players[app.human];
    if (app.mode === 'airMove' && app.selectedAirUid) {
      const a = s.airUnits.find(x => x.uid === app.selectedAirUid);
      if (a) v.validCells = E.fighterMoveTargets(s, a).map(c => key(c.r, c.c));
    } else if (app.mode === 'deploy' && app.selectedCardUid) {
      const card = p.hand.find(c => c.uid === app.selectedCardUid);
      if (card && card.kind === 'ship') v.validCells = E.deployCells(s, app.human, card).map(c => key(c.r, c.c));
    } else if (app.mode === 'move' && app.selectedUid) {
      const u = E.getUnit(s, app.selectedUid);
      if (u) v.validCells = E.moveTargets(s, u).map(c => key(c.r, c.c));
    } else if (app.mode === 'command' && app.selectedCardUid) {
      const card = p.hand.find(c => c.uid === app.selectedCardUid);
      if (card && card.kind === 'cmd') {
        const cmd = D.COMMAND_DEFS[card.defId];
        v.targetUids = E.commandTargets(s, app.human, cmd).map(t => t.uid);
      }
    } else if (app.mode === 'recon') {
      v.reconRows = [0, 1, 2, 3, 4, 5];
    } else if (app.mode === 'strike' && app.airCarrierUid) {
      const carrier = E.getUnit(s, app.airCarrierUid);
      if (carrier) {
        const last = app.path.length ? app.path[app.path.length - 1] : { r: carrier.r, c: carrier.c };
        const used = new Set(app.path.map(p => key(p.r, p.c)));
        if (app.path.length < D.MAX_PATH) {
          E.DIRS.forEach(d => {
            const r = last.r + d[0], c = last.c + d[1];
            if (!E.inBounds(r, c) || used.has(key(r, c))) return;
            v.validCells.push(key(r, c));
          });
        }
        if (app.path.length) {
          const vv = E.strikePathValid(s, carrier, app.airType, app.path);
          v.strikeTargetOk = !!vv.ok;
          const target = app.path[app.path.length - 1];
          const defender = otherSide(app.human);
          v.aaPreview = app.path.map(pt => E.computeCellAA(s, pt.r, pt.c, defender, target.r, target.c, false).per);
          if (vv.ok && vv.enemyShip) v.strikeTarget = { name: vv.enemyShip.name, hp: vv.enemyShip.hp, max: vv.enemyShip.maxHp };
        }
      }
    }
    return v;
  }
  function render() { UI.render(app.state, makeView()); }

  function clearSelection() {
    app.selectedUid = null; app.selectedCardUid = null; app.selectedAirUid = null; app.mode = null;
    app.airType = null; app.airCarrierUid = null; app.path = [];
  }

  /* ---------------- 开局 ---------------- */
  function startNewGame() {
    const playerDeck = app.decks[app.playerSide];
    const enemySide = app.playerSide === 'Allies' ? 'Axis' : 'Allies';
    const aiDeck = D.cloneDeck(D.AI_DECKS[enemySide]);
    const seedParam = parseInt(params.get('seed') || '', 10);
    const seed = Number.isFinite(seedParam) ? seedParam : ((Date.now() ^ (Math.random() * 0xffffffff)) >>> 0);
    try {
      app.gameId++;
      if (app.endTimer) { clearTimeout(app.endTimer); app.endTimer = null; }
      app.state = E.createGame({ seed, maxRounds: 16, playerDeck, aiDeck });
    } catch (err) {
      console.error(err);
      UI.toast('牌组无效：' + err.message);
      return;
    }
    app.busy = false; app.aiScheduled = false; app.pendingEnd = false;
    clearSelection();
    UI.hideOverlay(); UI.resetLog(); UI.hideTooltip();
    render();
    UI.Sound.init(); UI.Sound.play('click');
    if (app.demo) maybeDemo();
  }

  function showTitle() {
    app.gameId++;
    if (app.endTimer) { clearTimeout(app.endTimer); app.endTimer = null; }
    app.state = null; app.busy = false; app.aiScheduled = false;
    clearSelection();
    UI.resetLog();
    UI.showStart(app.decks, app.playerSide);
  }

  function checkEnd() {
    if (app.state && app.state.finished && !app.pendingEnd) {
      app.pendingEnd = true;
      const gen = app.gameId, game = app.state;
      app.endTimer = setTimeout(() => { if (gen === app.gameId && game.finished) UI.showEnd(game); }, 650);
    }
  }

  /* ---------------- AI ---------------- */
  async function runAI() {
    if (!app.state || app.state.finished || app.state.active !== app.ai || app.busy || app.aiScheduled) return;
    const gen = app.gameId, game = app.state;
    app.busy = true; app.selectedUid = null; app.mode = null;
    render();
    await sleep(360 / app.speed);
    if (gen !== app.gameId) return;
    try {
      await AI.playTurn(game, app.ai, {
        sleep: ms => sleep(ms / app.speed),
        onEvent: async ev => {
          if (gen !== app.gameId) throw new Error('ABORT');
          await UI.playEvent(ev);
          if (gen !== app.gameId) throw new Error('ABORT');
          render();
        },
        onChange: () => { }
      });
    } catch (err) {
      if (gen !== app.gameId) return;
      console.error(err);
      UI.toast('AI 行动出现异常，已跳过');
      try { if (game && !game.finished && game.active === app.ai) E.endTurn(game); } catch (e2) { }
    }
    if (gen !== app.gameId) return;
    app.busy = false;
    clearSelection(); render(); checkEnd();
  }

  /* ---------------- 人类操作 ---------------- */
  async function onCell(r, c, uid) {
    const s = app.state;
    if (!s || app.busy || app.aiScheduled || s.finished) return;
    if (s.active !== app.human) return;

    if (app.mode === 'airMove') {
      const a = s.airUnits.find(x => x.uid === app.selectedAirUid); if (!a) return;
      const res = E.moveFighter(s, a.uid, r, c);
      if (!res.ok) { UI.toast(res.error); return; }
      app.mode = null;
      await UI.playEvent({ type: 'airMove', air: a, result: res });
      render(); return;
    }
    if (app.mode === 'deploy') {
      if (!app.selectedCardUid) return;
      const res = E.deploy(s, app.selectedCardUid, r, c);
      if (!res.ok) { UI.toast(res.error); return; }
      await UI.playEvent({ type: 'deploy', unit: res.unit });
      clearSelection(); render(); return;
    }
    if (app.mode === 'move') {
      const u = E.getUnit(s, app.selectedUid); if (!u) return;
      const res = E.moveUnit(s, u.uid, r, c);
      if (!res.ok) { UI.toast(res.error); return; }
      await UI.playEvent({ type: 'move', unit: u, result: res });
      clearSelection(); render(); return;
    }
    if (app.mode === 'command') {
      if (!uid) return;
      const res = E.playCommand(s, app.selectedCardUid, uid);
      if (!res.ok) { UI.toast(res.error); return; }
      await UI.playEvent({ type: 'command', plan: { target: E.getUnit(s, uid) } });
      clearSelection(); render(); return;
    }
    if (app.mode === 'recon') {
      const res = E.reconRow(s, r);
      if (!res.ok) { UI.toast(res.error); return; }
      await UI.playEvent({ type: 'recon', row: r });
      clearSelection(); render(); return;
    }
    if (app.mode === 'strike') {
      const carrier = E.getUnit(s, app.airCarrierUid);
      if (!carrier) { clearSelection(); render(); return; }
      const idx = app.path.findIndex(p => p.r === r && p.c === c);
      if (idx >= 0) { app.path = app.path.slice(0, idx + 1); render(); return; }
      const last = app.path.length ? app.path[app.path.length - 1] : { r: carrier.r, c: carrier.c };
      if (Math.abs(last.r - r) + Math.abs(last.c - c) !== 1) { UI.toast('航路必须逐格相邻'); return; }
      if (app.path.length >= D.MAX_PATH) { UI.toast('航路最多 6 格'); return; }
      app.path.push({ r, c }); render(); return;
    }
    if (uid) {
      const u = E.getUnit(s, uid);
      if (u && u.side === app.human) {
        app.selectedUid = u.uid; app.selectedCardUid = null; app.selectedAirUid = null; app.mode = null; render(); return;
      }
    }
    clearSelection(); render();
  }

  function onCard(uid) {
    const s = app.state;
    if (!s || app.busy || app.aiScheduled || s.finished || s.active !== app.human) return;
    const p = s.players[app.human];
    const card = p.hand.find(c => c.uid === uid); if (!card) return;
    if (card.kind === 'ship') {
      if (app.selectedCardUid === uid) { app.selectedCardUid = null; app.mode = null; }
      else { app.selectedCardUid = uid; app.selectedUid = null; app.selectedAirUid = null; app.mode = 'deploy'; }
      render(); return;
    }
    if (p.commandUsed) { UI.toast('本回合已经使用过指令卡'); return; }
    if (s.phase !== 'deploy' && s.phase !== 'action') return;
    const cmd = D.COMMAND_DEFS[card.defId];
    if (cmd.cost > p.supply) { UI.toast('补给不足：' + cmd.name + ' 需要 ' + cmd.cost + ' 补给'); return; }
    if (cmd.target === 'none') {
      const res = E.playCommand(s, uid, null);
      if (!res.ok) { UI.toast(res.error); return; }
      UI.playEvent({ type: 'command', plan: {} }).then(() => { render(); checkEnd(); });
      return;
    }
    const targets = E.commandTargets(s, app.human, cmd);
    if (!targets.length) { UI.toast('没有适用目标'); return; }
    app.selectedCardUid = uid; app.selectedUid = null; app.selectedAirUid = null; app.mode = 'command'; render();
  }

  async function onAction(act) {
    const s = app.state;
    if (!s || app.busy || app.aiScheduled || s.finished) return;
    if (act === 'cancel') { clearSelection(); render(); return; }
    if (act === 'beginAction') {
      const r = E.beginAction(s); if (!r.ok) UI.toast(r.error);
      clearSelection(); render(); return;
    }
    if (act === 'endTurn') {
      const r = E.endTurn(s);
      if (!r.ok) { UI.toast(r.error); return; }
      clearSelection(); render();
      if (s.finished) { checkEnd(); return; }
      if (s.active === app.ai && !app.aiScheduled) {
        const gen = app.gameId;
        app.aiScheduled = true; render();
        setTimeout(() => { if (gen !== app.gameId) return; app.aiScheduled = false; runAI(); }, 360 / app.speed);
      }
      return;
    }
    if (act === 'recon') {
      if (s.players[app.human].reconUsed) { UI.toast('本回合已经侦察过'); return; }
      app.mode = 'recon'; app.selectedUid = null; app.selectedAirUid = null; render(); return;
    }
    if (act === 'airMove' || act === 'airAttackShip' || act === 'airAttackAir') {
      const a = s.airUnits.find(x => x.uid === app.selectedAirUid);
      if (!a) { UI.toast('请先选择一架战斗机'); return; }
      if (act === 'airMove') { app.mode = 'airMove'; render(); return; }
      if (act === 'airAttackShip') {
        const t = E.surfaceAt(s, a.r, a.c);
        if (!t || t.side === a.side) { UI.toast('当前格没有敌方水面舰'); return; }
        const res = E.fighterAttackShip(s, a.uid, t.uid);
        if (!res.ok) UI.toast(res.error);
        render(); return;
      }
      const t = s.airUnits.find(x => x.side !== a.side && x.type === 'F' && x.r === a.r && x.c === a.c);
      if (!t) { UI.toast('当前格没有敌方战斗机'); return; }
      const res = E.fighterAttackAir(s, a.uid, t.uid);
      if (!res.ok) UI.toast(res.error);
      render(); return;
    }
    if (act === 'combinedStrike') {
      const carrier = E.getUnit(s, app.selectedUid);
      if (!carrier || !carrier.air) { UI.toast('请先选择一艘航母'); return; }
      UI.openCombinedStrikePanel(s, app.human, (picks, targetUid) => {
        const res = E.combinedCarrierStrike(s, picks, targetUid);
        if (!res.ok) { UI.toast(res.error); return; }
        render();
      });
      return;
    }
    const u = E.getUnit(s, app.selectedUid);
    if (!u) { UI.toast('请先选择一艘己方舰船'); return; }
    if (act === 'aa') {
      const targets = E.aaTargets(s, u);
      if (!targets.length) { UI.toast('射程内没有敌方战斗机'); return; }
      UI.openAntiAirPanel(u, targets, targetUid => {
        const res = E.fireAA(s, u.uid, targetUid);
        if (!res.ok) UI.toast(res.error);
        render();
      });
      return;
    }
    if (act === 'move') { app.mode = 'move'; app.path = []; render(); return; }
    if (act === 'heading') {
      if (u.turnProgress > 0 && u.turnTarget) {
        const r = E.turnUnit(s, u.uid, u.turnTarget);
        if (!r.ok) UI.toast(r.error);
        render();
        return;
      }
      UI.openHeadingPanel(u, heading => {
        const r = E.turnUnit(s, u.uid, heading);
        if (!r.ok) UI.toast(r.error);
        render();
      });
      return;
    }
    if (act === 'fire') { UI.openFirePanel(u, sel => executeFire(u, sel)); return; }
    if (act === 'strike') {
      UI.pickSquadron(u, type => {
        app.mode = 'strike'; app.airType = type; app.airCarrierUid = u.uid; app.path = []; render();
      });
      return;
    }
    if (act === 'search') {
      const r = E.searchRow(s, u.uid);
      if (!r.ok) { UI.toast(r.error); return; }
      await UI.playEvent({ type: 'search', unit: u });
      render(); return;
    }
    if (act === 'undoPath') { app.path.pop(); render(); return; }
    if (act === 'confirmPath') {
      const carrier = E.getUnit(s, app.airCarrierUid);
      if (!carrier || !app.path.length) { UI.toast('请先规划航路'); return; }
      const v = E.strikePathValid(s, carrier, app.airType, app.path);
      if (!v.ok) { UI.toast(v.error); return; }
      const res = E.carrierStrike(s, carrier.uid, app.airType, app.path.slice());
      if (!res.ok) { UI.toast(res.error); return; }
      await UI.playEvent({ type: 'strike', unit: carrier, result: res });
      clearSelection(); render(); checkEnd(); return;
    }
  }

  async function executeFire(unit, sel) {
    const s = app.state;
    if (!s || s.finished) return;
    const events = [];
    if (sel.main) {
      const t = E.getUnit(s, sel.main);
      if (t) {
        const r = E.fireMain(s, unit.uid, t.uid);
        if (r.ok) events.push({ type: 'main', unit, target: t, result: r });
        else UI.toast(r.error);
      }
    }
    if (sel.secondary) {
      const t = E.getUnit(s, sel.secondary);
      if (t && t.hp > 0) {
        const r = E.fireSecondary(s, unit.uid, t.uid);
        if (r.ok) events.push({ type: 'secondary', unit, target: t, result: r });
        else UI.toast(r.error);
      }
    }
    [['torpPort', 'port'], ['torpStarboard', 'starboard'], ['torpFore', 'fore']].forEach(([key, side]) => {
      if (!sel[key]) return;
      const t = E.getUnit(s, sel[key]);
      if (t && t.hp > 0) {
        const r = E.fireTorpedo(s, unit.uid, t.uid, side);
        if (r.ok) events.push({ type: 'torp', unit, target: t, side, result: r });
        else UI.toast(r.error);
      }
    });
    if (sel.depth) {
      const t = E.getUnit(s, sel.depth);
      if (t && t.hp > 0) {
        const r = E.fireDepth(s, unit.uid, t.uid);
        if (r.ok) events.push({ type: 'depth', unit, target: t, result: r });
        else UI.toast(r.error);
      }
    }
    for (const ev of events) {
      await UI.playEvent(ev);
      render();
      if (s.finished) break;
    }
    render(); checkEnd();
  }

  function onShipRow(uid) {
    const s = app.state;
    if (!s || app.busy || app.aiScheduled || s.finished || s.active !== app.human) return;
    const u = E.getUnit(s, uid); if (!u || u.side !== app.human) return;
    app.selectedUid = uid; app.selectedCardUid = null; app.selectedAirUid = null; app.mode = null; render();
  }

  function onAir(uid) {
    const s = app.state;
    if (!s || app.busy || app.aiScheduled || s.finished || s.active !== app.human) return;
    const a = s.airUnits.find(x => x.uid === uid);
    if (!a || a.side !== app.human) return;
    app.selectedAirUid = uid; app.selectedUid = null; app.selectedCardUid = null; app.mode = null; render();
  }

  function onCancel() {
    if (app.busy) return;
    if (app.mode === 'strike' && app.path.length) { app.path.pop(); render(); return; }
    clearSelection(); render();
  }

  function onRestart() {
    if (!app.state || app.state.finished) { startNewGame(); return; }
    UI.confirmBox('重新开始？', '当前战役进度将丢失。', () => startNewGame());
  }

  /* ---------------- 牌组 ---------------- */
  function onBuild() {
    UI.showDeckBuilder(app.decks[app.playerSide], {
      onDone: deck => {
        const errs = D.validateDeck(deck);
        if (errs.length) { UI.toast(errs[0]); return; }
        app.decks[app.playerSide] = D.cloneDeck(deck);
        saveDecks();
        UI.showStart(app.decks, app.playerSide);
      },
      onCancel: () => UI.showStart(app.decks, app.playerSide)
    });
  }

  /* ---------------- 演示 ---------------- */
  async function maybeDemo() {
    if (!app.demo || !app.state) return;
    const rounds = Math.max(1, parseInt(params.get('rounds') || '5', 10));
    UI.setSpeed(true);
    app.busy = true; render();
    while (app.state && !app.state.finished) {
      if (app.state.active === 'A' && app.state.round > rounds && app.state.phase === 'deploy') break;
      await AI.playTurn(app.state, app.state.active, { sleep: () => Promise.resolve(), onEvent: async () => { }, onChange: () => { } });
      if (app.state.round > rounds + 1) break;
    }
    app.busy = false; clearSelection(); render(); checkEnd();
  }

  /* ---------------- 初始化 ---------------- */
  function init() {
    loadDecks();
    if (!window.STEEL_TIDE_SINGLE_FILE && (location.protocol === 'http:' || location.protocol === 'https:')) {
      const manifest = document.createElement('link');
      manifest.rel = 'manifest';
      manifest.href = 'manifest.json';
      document.head.appendChild(manifest);
    }
    UI.init({
      onCell, onCard, onAction, onShipRow, onCancel, onRestart,
      onRules: () => UI.showRules(),
      onStart: () => startNewGame(),
      onBuild: () => onBuild(),
      onAgain: () => startNewGame(),
      onTitle: () => showTitle(),
      onInfo: () => UI.showInfoPanel(),
      onShipInfo: uid => UI.showShipInfo(uid),
      onCardInfo: uid => UI.showCardInfo(uid),
      onAir: uid => onAir(uid),
      onSide: side => { app.playerSide = side; UI.showStart(app.decks, side); }
    });
    UI.setSpeed(app.speed > 1);
    if (app.demo) {
      app.playerSide = params.get('faction') === 'Axis' ? 'Axis' : 'Allies';
      startNewGame();
    } else {
      UI.showStart(app.decks, app.playerSide);
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();

  window.SteelTide = { app, startNewGame, render, makeView };
  if (!window.STEEL_TIDE_SINGLE_FILE && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.protocol === 'http:')) {
    navigator.serviceWorker.register('sw.js').catch(function () { });
  }
})();


  if (new URLSearchParams(location.search).get('debug') === '1') {
    setTimeout(() => {
      const el = document.createElement('pre');
      el.style.cssText = 'position:fixed;left:0;top:0;z-index:9999;background:#000;color:#7f7;font:10px monospace;padding:4px;margin:0;white-space:pre';
      const q = s => { const e = document.querySelector(s); if (!e) return null; const r = e.getBoundingClientRect(); return { w: +r.width.toFixed(1), l: +r.left.toFixed(1), r: +r.right.toFixed(1) }; };
      el.textContent = JSON.stringify({
        iw: innerWidth, ih: innerHeight,
        wrap: q('.start-wrap'), left: q('.start-left'), right: q('.start-right'),
        tabs: q('.side-tabs'), pick: q('.fleet-pick'), chips: q('.fp-ships'),
        desc: q('.start-desc'), foot: q('.start-footer')
      }, null, 1);
      document.body.appendChild(el);
    }, 1200);
  }





</script>
</body>
</html>
