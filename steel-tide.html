<script>
/* ============================================================
 * 钢铁潮汐 · 界面 v2
 * 5 列战场 / 四向朝向 / 主副炮开火面板 / 起火进水 / 牌组编辑器
 * ============================================================ */
(function () {
  'use strict';
  const D = window.GameData;
  const E = window.GameEngine;

  const PHASE_NAME = { deploy: '部署/行动', action: '部署/行动', gameover: '战役结束', supply: '补给阶段' };
  const HEAD_NAME = { N: '北', E: '东', S: '南', W: '西' };
  const HEAD_ARROW = { N: '↑', E: '→', S: '↓', W: '←' };

  let state = null;
  let view = null;
  let handlers = {};
  let lastLogId = 0;
  let lastTapUid = 0;
  let lastTapAt = 0;
  let lastHandCard = 0;
  let lastHandAt = 0;
  let tooltipEl = null;
  let modalEl = null;
  let audioCtx = null;
  let soundOn = true;
  let fast = false;

  /* ---------------- 音效 ---------------- */
  const Sound = {
    init() {
      if (audioCtx) return;
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
    },
    noise(dur, freq, gain, type) {
      if (!audioCtx || !soundOn) return;
      const ctx = audioCtx;
      const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = ctx.createBufferSource(); src.buffer = buf;
      const filter = ctx.createBiquadFilter(); filter.type = type || 'lowpass'; filter.frequency.value = freq;
      const g = ctx.createGain(); g.gain.value = gain;
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
      src.connect(filter).connect(g).connect(ctx.destination); src.start();
    },
    tone(freq, dur, gain, type) {
      if (!audioCtx || !soundOn) return;
      const ctx = audioCtx;
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(freq, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.25), ctx.currentTime + dur);
      g.gain.value = gain; g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
      o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime + dur);
    },
    play(name) {
      if (!audioCtx || !soundOn) return;
      try {
        if (name === 'gun') { this.noise(0.18, 1200, 0.09); this.tone(120, 0.16, 0.05, 'square'); }
        else if (name === 'torp') { this.noise(0.5, 600, 0.06); this.tone(300, 0.4, 0.03, 'sawtooth'); }
        else if (name === 'boom') { this.noise(0.7, 260, 0.12); this.tone(70, 0.6, 0.07, 'sine'); }
        else if (name === 'depth') { this.noise(0.25, 400, 0.08); this.tone(90, 0.3, 0.05); }
        else if (name === 'plane') { this.tone(180, 0.35, 0.03, 'sawtooth'); }
        else if (name === 'aa') { this.noise(0.12, 2600, 0.04, 'highpass'); }
        else if (name === 'click') { this.tone(520, 0.05, 0.02, 'square'); }
        else if (name === 'sink') { this.tone(65, 0.9, 0.06, 'sine'); this.noise(0.8, 200, 0.08); }
      } catch (e) { }
    }
  };

  /* ---------------- 舰船剪影 ---------------- */
  function shipSvg(cls) {
    const common = 'viewBox="0 0 40 90" preserveAspectRatio="xMidYMid meet" fill="none"';
    if (cls === 'SS') {
      return `<svg class="ship-svg" ${common}>
        <ellipse cx="20" cy="47" rx="8" ry="35" fill="currentColor" opacity=".9"/>
        <rect x="15.5" y="28" width="9" height="18" rx="3.5" fill="#000" opacity=".28"/>
        <path d="M20 7v8M16 50h8" stroke="#000" stroke-opacity=".3" stroke-width="1.5"/>
        <ellipse cx="20" cy="47" rx="3" ry="20" fill="#000" opacity=".12"/>
      </svg>`;
    }
    if (cls === 'CV' || cls === 'CVL' || cls === 'CVE') {
      const w = cls === 'CV' ? 13 : 11;
      return `<svg class="ship-svg" ${common}>
        <path d="M${20 - w} 8 L${20 + w} 8 L${20 + w + 1} 78 L${20 + w - 4} 84 L${20 - w + 4} 84 L${20 - w - 1} 78 Z" fill="currentColor" opacity=".92"/>
        <path d="M${20 - w + 2} 14h${w * 2 - 4}v60h-${w * 2 - 4}z" fill="#000" opacity=".16"/>
        <path d="M${20 - w + 2} 26h${w * 2 - 4}M${20 - w + 2} 44h${w * 2 - 4}M${20 - w + 2} 62h${w * 2 - 4}" stroke="#000" stroke-opacity=".18"/>
        <rect x="${20 + w - 7}" y="16" width="4" height="14" fill="#000" opacity=".3"/>
        <rect x="${20 + w - 7}" y="52" width="4" height="9" fill="#000" opacity=".25"/>
      </svg>`;
    }
    const big = cls === 'BB';
    const hull = big ? 'M20 4 L30 26 L31 72 L26 86 L14 86 L9 72 L10 26 Z'
      : cls === 'CA' ? 'M20 4 L28.5 25 L29.5 72 L25 86 L15 86 L10.5 72 L11.5 25 Z'
        : cls === 'CL' ? 'M20 5 L27.5 26 L28 74 L24 85 L16 85 L12 74 L12.5 26 Z'
          : 'M20 6 L26.5 27 L27 74 L23.5 85 L16.5 85 L13 74 L13.5 27 Z';
    const turret = big
      ? `<circle cx="20" cy="20" r="4.2" fill="#000" opacity=".26"/><circle cx="20" cy="44" r="4.6" fill="#000" opacity=".26"/><circle cx="20" cy="66" r="4.2" fill="#000" opacity=".26"/>
         <path d="M20 12v-6M20 35v-6M20 57v-6" stroke="#000" stroke-opacity=".3" stroke-width="2"/>`
      : cls === 'CA'
        ? `<circle cx="20" cy="20" r="3.4" fill="#000" opacity=".25"/><circle cx="20" cy="42" r="3.6" fill="#000" opacity=".25"/><circle cx="20" cy="64" r="3.2" fill="#000" opacity=".25"/>`
        : cls === 'CL'
          ? `<circle cx="20" cy="21" r="2.8" fill="#000" opacity=".25"/><circle cx="20" cy="40" r="3" fill="#000" opacity=".25"/><circle cx="20" cy="59" r="2.6" fill="#000" opacity=".25"/>`
          : `<circle cx="20" cy="22" r="2.4" fill="#000" opacity=".25"/><circle cx="20" cy="42" r="2.4" fill="#000" opacity=".25"/>`;
    return `<svg class="ship-svg" ${common}>
      <path d="${hull}" fill="currentColor" opacity=".92"/>
      <path d="M20 30v22M14 40h12" stroke="#000" stroke-opacity=".12" stroke-width="3"/>
      ${turret}
      <rect x="17" y="52" width="6" height="12" rx="1" fill="#000" opacity=".18"/>
    </svg>`;
  }

  /* ---------------- 工具 ---------------- */
  function h(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
  function otherSide(s) { return s === 'A' ? 'B' : 'A'; }
  function sideClass(side) { return state.players[side].deckSide === 'Allies' ? 'us' : 'jp'; }
  function sideColor(side) { return state.players[side].deckSide === 'Allies' ? '#6fa8dc' : '#e07a7a'; }
  function hpColor(ratio) { return ratio > 0.6 ? '#6fbf8f' : ratio > 0.3 ? '#d9a84e' : '#cf5d52'; }
  function key(r, c) { return r + ',' + c; }
  function cellEl(r, c) { return document.querySelector(`#board .cell[data-r="${r}"][data-c="${c}"]`); }
  function boardRect() { return document.getElementById('board').getBoundingClientRect(); }
  function shellRect() { return document.querySelector('.board-shell').getBoundingClientRect(); }
  function cellCenter(r, c) {
    const cell = cellEl(r, c); if (!cell) return { x: 0, y: 0 };
    const cr = cell.getBoundingClientRect(), sr = shellRect();
    return { x: cr.left - sr.left + cr.width / 2, y: cr.top - sr.top + cr.height / 2 };
  }
  function floodTotal(u) { return u.flood.port + u.flood.starboard; }
  function hasFired(u) { return u.firedMain || u.firedSecondary || u.firedTorp || u.firedDepth || u.firedAA || u.launched; }
  function canTurn(u) { return E.canTurn(state, u); }
  function shipStatus(u) {
    const s = [];
    if (u.justDeployed) s.push('刚部署（本回合不能移动）');
    if (u.ap < u.apMax) s.push('AP ' + u.ap + '/' + u.apMax);
    if (u.turnProgress > 0) s.push('转向中 ' + u.turnProgress + '/' + u.turnCost);
    else if (u.turned) s.push('本轮转向（旧炮位）');
    if (u.moved) s.push('已移动');
    if (hasFired(u)) s.push('已开火');
    if (u.torpedoState) {
      if (u.cls === 'SS') {
        if (u.torpedoState.fore.reload > 0) s.push('舰首鱼雷装填');
      } else {
        if (u.torpedoState.port.reload > 0) s.push('左舷鱼雷装填');
        if (u.torpedoState.starboard.reload > 0) s.push('右舷鱼雷装填');
      }
    }
    if (u.fire) s.push('起火 ' + u.fire);
    if (floodTotal(u)) s.push('进水 左' + u.flood.port + '/右' + u.flood.starboard);
    return s.join(' · ');
  }

  /* ---------------- 初始化 ---------------- */
  function init(h) {
    handlers = h || {};
    tooltipEl = document.getElementById('tooltip');
    buildBoardHead(); buildBoard();
    document.getElementById('board').addEventListener('click', onBoardClick);
    document.getElementById('board').addEventListener('contextmenu', e => { e.preventDefault(); if (handlers.onCancel) handlers.onCancel(); });
    document.getElementById('hand').addEventListener('click', e => {
      const card = e.target.closest('.hcard'); if (!card) return;
      Sound.play('click');
      const uid = parseInt(card.dataset.card, 10);
      const isCmd = card.classList.contains('cmd');
      if (isCmd) { lastHandCard = 0; lastHandAt = 0; if (handlers.onCard) handlers.onCard(uid); return; }
      const now = Date.now();
      if (lastHandCard === uid && now - lastHandAt < 500) {
        lastHandCard = 0; lastHandAt = 0;
        if (handlers.onCardInfo) handlers.onCardInfo(uid);
        return;
      }
      lastHandCard = uid; lastHandAt = now;
      if (handlers.onCard) handlers.onCard(uid);
    });
    document.getElementById('actionBar').addEventListener('click', e => {
      const btn = e.target.closest('[data-act]'); if (!btn || btn.disabled) return;
      Sound.play('click');
      if (handlers.onAction) handlers.onAction(btn.dataset.act);
    });
    document.getElementById('fleetPanel').addEventListener('click', e => {
      const row = e.target.closest('.ship-row[data-uid]'); if (!row) return;
      if (handlers.onShipRow) handlers.onShipRow(parseInt(row.dataset.uid, 10));
    });
    document.getElementById('overlay').addEventListener('click', e => {
      const sideBtn = e.target.closest('[data-side]');
      if (sideBtn) { if (handlers.onSide) handlers.onSide(sideBtn.dataset.side); return; }
      const btn = e.target.closest('[data-cmd]'); if (!btn) return;
      Sound.play('click');
      const cmd = btn.dataset.cmd;
      if (cmd === 'start' && handlers.onStart) handlers.onStart();
      else if (cmd === 'build' && handlers.onBuild) handlers.onBuild();
      else if (cmd === 'again' && handlers.onAgain) handlers.onAgain();
      else if (cmd === 'title' && handlers.onTitle) handlers.onTitle();
      else if (cmd === 'rules' && handlers.onRules) handlers.onRules();
    });
    document.getElementById('btnRules').addEventListener('click', () => handlers.onRules && handlers.onRules());
    const mobileInfoBtn = document.getElementById('btnMobileInfo');
    if (mobileInfoBtn) mobileInfoBtn.addEventListener('click', () => handlers.onInfo && handlers.onInfo());
    document.getElementById('btnRestart').addEventListener('click', () => handlers.onRestart && handlers.onRestart());
    document.getElementById('btnSound').addEventListener('click', () => {
      soundOn = !soundOn;
      document.getElementById('btnSound').textContent = '音效 ' + (soundOn ? '开' : '关');
      document.getElementById('btnSound').classList.toggle('active', soundOn);
      if (soundOn) { Sound.init(); Sound.play('click'); }
    });

    let tipTarget = null;
    document.addEventListener('mouseover', e => {
      const t = e.target.closest('[data-tip]'); if (!t) return;
      tipTarget = t; showTooltip(t.dataset.tip, e.clientX, e.clientY);
    });
    document.addEventListener('mousemove', e => {
      if (!tipTarget || !tooltipEl.classList.contains('show')) return;
      positionTooltip(e.clientX, e.clientY);
    });
    document.addEventListener('mouseout', e => {
      if (!tipTarget) return;
      if (e.relatedTarget && tipTarget.contains(e.relatedTarget)) return;
      tipTarget = null; hideTooltip();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        if (modalEl) { closeModal(); return; }
        if (handlers.onCancel) handlers.onCancel();
      }
    });
    window.addEventListener('resize', () => { if (view && view.mode === 'strike') drawPathLine(); });
  }

  function buildBoardHead() {
    const head = document.getElementById('boardHead');
    head.innerHTML = '<div class="col-label">SECTOR</div>' +
      [0, 1, 2, 3, 4].map(c => `<div class="col-label">C${c}</div>`).join('');
  }
  function buildBoard() {
    const board = document.getElementById('board');
    board.innerHTML = '';
    for (let r = 0; r < D.BOARD_ROWS; r++) {
      const row = document.createElement('div');
      row.className = 'row ' + (r === 0 ? 'zone-a' : r === 5 ? 'zone-b' : 'zone-n');
      row.dataset.r = r;
      const label = document.createElement('div');
      label.className = 'row-label ' + (r === 0 ? 'zone-a' : r === 5 ? 'zone-b' : 'zone-n');
      row.appendChild(label);
      for (let c = 0; c < D.BOARD_COLS; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell'; cell.dataset.r = r; cell.dataset.c = c;
        row.appendChild(cell);
      }
      board.appendChild(row);
    }
  }

  /* ---------------- 渲染 ---------------- */
  function render(s, v) {
    state = s; view = v || {};
    if (!state) return;
    renderTop(); renderPhase(); renderFleets(); renderBoard(); renderActionBar(); renderHand(); renderLog();
  }

  function renderTop() {
    const strip = document.getElementById('statusStrip');
    if (!state) { strip.innerHTML = ''; return; }
    const active = state.active;
    const sc = sideClass(active);
    const round = state.finished ? '战役结束' : `第 ${state.round} / ${state.maxRounds} 轮`;
    strip.innerHTML = `<div class="status-pill"><b>${round}</b></div>` +
      `<div class="status-pill ${sc}"><span class="side-dot"></span>${state.players[active].short} · ${PHASE_NAME[state.phase] || ''}</div>` +
      `<div class="status-pill"><span>击沉</span><b>${state.players.A.sinkPoints} : ${state.players.B.sinkPoints}</b></div>`;
  }

  function renderPhase() {
    const el = document.getElementById('phaseBanner');
    if (!state) { el.innerHTML = ''; return; }
    if (view.busy) {
      el.className = 'phase-banner jp urgent';
      el.innerHTML = '<span class="sep"></span><b>对方指挥中</b> 正在行动<span class="sep"></span>';
      return;
    }
    if (state.finished) {
      el.className = 'phase-banner';
      el.innerHTML = `<span class="sep"></span><b>战役结束</b> ${h(state.endReason || '')}<span class="sep"></span>`;
      return;
    }
    const side = state.active;
    el.className = 'phase-banner ' + sideClass(side);
    el.innerHTML = `<span>第 ${state.round} 轮</span><span class="sep"></span>` +
      `<b>${state.players[side].short}回合</b><span>·</span><span>${PHASE_NAME[state.phase] || ''}</span>` +
      `<span class="sep"></span>`;
  }

  function renderFleets() {
    const panel = document.getElementById('fleetPanel');
    const order = [view.humanSide || 'A', otherSide(view.humanSide || 'A')];
    panel.innerHTML = order.map(side => fleetBlockHtml(side)).join('') + tacticalPanelHtml();
  }

  function supplyBarHtml(p, cls) {
    const capPct = Math.max(0, Math.min(1, p.cap / D.SUPPLY_CAP_MAX));
    const fillPct = p.cap ? Math.max(0, Math.min(1, p.supply / p.cap)) : 0;
    return `<div class="supply-row">
      <span class="supply-label">补给</span>
      <div class="supply-bar ${cls}"><i style="width:${capPct * 100}%"><b style="width:${fillPct * 100}%"></b></i></div>
      <span class="supply-num">${p.supply}<small>/${p.cap}</small></span>
    </div>`;
  }

  function fleetBlockHtml(side) {
    const p = state.players[side];
    const cls = sideClass(side);
    const units = state.units.filter(u => u.side === side);
    const human = view.humanSide;
    const visible = units.filter(u => u.cls !== 'SS' || side === human || E.isSubDetected(state, u, human));
    const hiddenSubs = side !== human ? units.filter(u => u.cls === 'SS' && !E.isSubDetected(state, u, human)).length : 0;
    const active = state.active === side && !state.finished;
    const order = { CV: 0, CVL: 0, CVE: 0, BB: 1, CA: 2, CL: 3, DD: 4, SS: 5 };
    const ships = visible.slice().sort((a, b) => (order[a.cls] || 9) - (order[b.cls] || 9) || b.points - a.points);
    const rows = ships.map(u => shipRowHtml(u, side === human)).join('');
    return `<div class="fleet-block ${cls} ${active ? 'active' : ''}">
      <div class="fleet-head">
        <div class="fleet-name">${h(p.short)}<small>${h(p.deckName)}</small></div>
        <div class="fleet-score">${p.sinkPoints}<small>击沉点数</small></div>
      </div>
      ${supplyBarHtml(p, cls)}
      <div class="meta-row">
        <div class="meta"><b>${p.deck.length}</b><span>牌库</span></div>
        <div class="meta"><b>${p.hand.length}</b><span>手牌</span></div>
        <div class="meta"><b>${units.length}</b><span>在役</span></div>
      </div>
      <div class="ship-list">${rows || '<div class="hidden-note" style="color:var(--dim)">暂无舰船</div>'}</div>
      ${hiddenSubs ? `<div class="hidden-note">◈ 水下不明目标 ×${hiddenSubs}</div>` : ''}
    </div>`;
  }

  function shipRowHtml(u, own) {
    const ratio = u.hp / u.maxHp;
    return `<div class="ship-row ${view.selectedUid === u.uid ? 'sel' : ''}" data-uid="${u.uid}" data-tip="ship:${u.uid}">
      <span class="cls">${u.cls}</span>
      <span class="nm">${h(u.name)}</span>
      ${u.fire ? `<span class="dot fire">火${u.fire}</span>` : ''}
      ${floodTotal(u) ? `<span class="dot flood">水${floodTotal(u)}</span>` : ''}
      <span class="hpbar"><i style="width:${Math.max(0, ratio * 100)}%;background:${hpColor(ratio)}"></i></span>
      <span class="hptxt">${u.hp}/${u.maxHp}</span>
    </div>`;
  }

  function tacticalPanelHtml() {
    const human = view.humanSide || 'A';
    const rows = { A: [], B: [] };
    ['A', 'B'].forEach(side => {
      rows[side].push('R' + E.backRow(side));
      for (let r = 0; r < D.BOARD_ROWS; r++) {
        if (E.isControlledRow(state, side, r) && !rows[side].includes('R' + r)) rows[side].push('R' + r);
      }
      rows[side].sort((a, b) => parseInt(a.slice(1), 10) - parseInt(b.slice(1), 10));
    });
    const remain = Math.max(0, state.maxRounds - state.round + 1);
    let hint = state.phase === 'deploy'
      ? '部署在后方或控制线。后排满了就派水面舰向前推进，打开新的部署行。'
      : '每舰一回合可移动一次并开火一次；主炮、副炮可打不同目标。';
    if (view.selectedUid) {
      const u = E.getUnit(state, view.selectedUid);
      if (u) hint = `已选「${u.name}」：${shipStatus(u) || '尚未行动'}。`;
    }
    return `<div class="tac-panel">
      <div class="tac-title">战役态势</div>
      <div class="tac-row"><span>剩余轮数</span><b>${remain}</b></div>
      <div class="tac-row"><span>${h(state.players.A.short)}控制线</span><b>${rows.A.join(' · ')}</b></div>
      <div class="tac-row"><span>${h(state.players.B.short)}控制线</span><b>${rows.B.join(' · ')}</b></div>
      <div class="tac-hint">${h(hint)}</div>
    </div>`;
  }

  function renderBoard() {
    if (!state) return;
    const human = view.humanSide || 'A';
    const valid = new Set(view.validCells || []);
    const targetSet = new Set(view.targetUids || []);
    const reconRows = new Set(view.reconRows || []);
    const pathKeys = new Set((view.path || []).map(p => key(p.r, p.c)));
    const pathIndex = {};
    (view.path || []).forEach((p, i) => { pathIndex[key(p.r, p.c)] = i + 1; });
    for (let r = 0; r < D.BOARD_ROWS; r++) {
      const rowEl = document.querySelector(`#board .row[data-r="${r}"]`);
      const label = rowEl.querySelector('.row-label');
      label.className = 'row-label ' + (r === 0 ? 'zone-a' : r === 5 ? 'zone-b' : 'zone-n');
      const zone = r === 0 ? state.players.A.short + ' · 后方' : r === 5 ? state.players.B.short + ' · 后方' : '前线 ' + r;
      label.innerHTML = `<span class="rname">R${r}</span><span class="rzone">${h(zone)}</span>`;
      const unknown = (E.unknownSubRows(state, human) || []).includes(r);
      if (unknown) {
        const sp = document.createElement('span'); sp.className = 'subhint'; sp.textContent = '◈ 水下不明'; label.appendChild(sp);
      }
      for (let c = 0; c < D.BOARD_COLS; c++) {
        const cell = cellEl(r, c);
        cell.className = 'cell';
        cell.innerHTML = `<span class="coord">${r}·${c}</span>`;
        const k = key(r, c);
        if (valid.has(k)) cell.classList.add(view.mode === 'move' ? 'valid-move' : view.mode === 'deploy' ? 'valid-deploy' : 'valid-target');
        if (reconRows.has(r) && view.mode === 'recon') cell.classList.add('recon-row');
        if (pathKeys.has(k)) {
          cell.classList.add('path');
          const no = document.createElement('span'); no.className = 'step-no'; no.textContent = pathIndex[k]; cell.appendChild(no);
        }
        if (view.mode === 'strike' && view.path && view.path.length &&
          view.path[view.path.length - 1].r === r && view.path[view.path.length - 1].c === c) cell.classList.add('target-cell');
        const surf = E.surfaceAt(state, r, c);
        if (surf) {
          cell.appendChild(shipTokenEl(surf, human));
          if (targetSet.has(surf.uid)) cell.classList.add('valid-target');
        }
        const sub = E.subAt(state, r, c);
        if (sub) {
          const visible = sub.side === human || E.isSubDetected(state, sub, human);
          if (visible) {
            cell.appendChild(subTokenEl(sub, human));
            if (targetSet.has(sub.uid)) cell.classList.add('valid-target');
          }
        }
        const airs = E.airAt(state, r, c);
        airs.forEach(a => {
          const el = document.createElement('div');
          const own = a.side === human;
          el.className = `air-token ${own ? 'us' : 'jp'} ${view.selectedAirUid === a.uid ? 'sel' : ''}`;
          el.dataset.airUid = a.uid;
          el.innerHTML = `<span class="plane-glyph">✈</span><b>${a.planes.length}</b>${a.type === 'F' ? '<i>F</i>' : ''}`;
          cell.appendChild(el);
        });
      }
    }
    drawPathLine();
  }

  function shipTokenEl(u, human) {
    const div = document.createElement('div');
    const fc = state.players[u.side].deckSide === 'Allies' ? 'us' : 'jp';
    div.className = `ship-token ${fc} ${view.selectedUid === u.uid ? 'sel' : ''} ${state.lastActor === u.uid ? 'acting' : ''}`;
    div.dataset.uid = u.uid;
    const ratio = Math.max(0, u.hp / u.maxHp);
    const color = hpColor(ratio);
    const badges = [];
    if (u.fire) badges.push(`<span class="sbadge fire">火${u.fire}</span>`);
    if (floodTotal(u)) badges.push(`<span class="sbadge flood">水${floodTotal(u)}</span>`);
    const anyReload = u.torpedoState && Object.values(u.torpedoState).some(st => st.reload > 0);
    if (anyReload) badges.push('<span class="sbadge cool">雷装填</span>');
    if (u.turnProgress > 0) badges.push(`<span class="sbadge cool">转${u.turnProgress}/${u.turnCost}</span>`);
    else if (u.turned) badges.push('<span class="sbadge">转</span>');
    if (u.moved) badges.push('<span class="sbadge">移</span>');
    if (hasFired(u)) badges.push('<span class="sbadge">炮</span>');
    div.innerHTML = `<div class="ship-stripe"></div>
      <div class="ship-main">
        ${shipSvg(u.cls).replace('class="ship-svg"', `class="ship-svg head-${u.heading}"`)}
        <div class="ship-info">
          <div class="ship-name">${h(u.name)}</div>
          <div class="ship-class">${h(D.NATIONS[u.nation].short)} · ${u.cls}</div>
          <div class="ship-hp"><span class="bar"><i style="width:${ratio * 100}%;background:${color}"></i></span><span class="num">${u.hp}</span></div>
        </div>
      </div>
      ${badges.length ? `<div class="ship-badges">${badges.join('')}</div>` : ''}`;
    return div;
  }

  function subTokenEl(u, human) {
    const enemy = u.side !== human;
    const div = document.createElement('div');
    div.className = `sub-token ${enemy ? 'enemy' : ''} ${u.exposed ? 'exposed' : ''}`;
    div.dataset.uid = u.uid;
    div.innerHTML = `<span>潜 ${u.hp}</span><span class="sub-hp"><i style="width:${Math.max(0, u.hp / u.maxHp * 100)}%"></i></span>${u.torpedoState && u.torpedoState.fore.reload > 0 ? '<span class="sub-reload">装填</span>' : ''}`;
    return div;
  }

  function drawPathLine() {
    const svg = document.getElementById('pathLayer');
    svg.innerHTML = '';
    if (!state || !view || view.mode !== 'strike' || !view.path || !view.path.length) return;
    const carrier = E.getUnit(state, view.airCarrierUid); if (!carrier) return;
    const br = boardRect(), sr = shellRect();
    svg.style.left = (br.left - sr.left) + 'px'; svg.style.top = (br.top - sr.top) + 'px';
    svg.style.width = br.width + 'px'; svg.style.height = br.height + 'px';
    svg.setAttribute('viewBox', `0 0 ${br.width} ${br.height}`);
    const pts = [{ r: carrier.r, c: carrier.c }].concat(view.path).map(p => {
      const cr = cellEl(p.r, p.c).getBoundingClientRect();
      return `${cr.left - br.left + cr.width / 2},${cr.top - br.top + cr.height / 2}`;
    });
    const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    poly.setAttribute('points', pts.join(' ')); svg.appendChild(poly);
    const s = pts[0].split(',');
    const c0 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c0.setAttribute('cx', s[0]); c0.setAttribute('cy', s[1]); c0.setAttribute('r', '3'); svg.appendChild(c0);
  }

  /* ---------------- 手牌 ---------------- */
  function renderHand() {
    const handEl = document.getElementById('hand');
    const title = document.getElementById('handTitle');
    const hint = document.getElementById('handHint');
    if (!state) { handEl.innerHTML = ''; return; }
    const p = state.players[view.humanSide];
    title.textContent = `手牌 · ${p.short}`;
    const myTurn = state.active === view.humanSide && !state.finished && !view.busy;
    if (myTurn) hint.textContent = p.commandUsed ? '部署/行动：点击舰船卡部署，点舰船行动；指令已用' : '点击舰船卡部署，点舰船行动；指令卡随时可用（注意补给）';
    else if (state.finished) hint.textContent = '战役结束';
    else hint.textContent = '等待对方行动';
    handEl.innerHTML = p.hand.map(card => handCardHtml(card, p, myTurn)).join('') ||
      '<div style="color:var(--dim);font-size:10px;padding:10px">手牌为空</div>';
  }

  function handCardHtml(card, p, myTurn) {
    const isShip = card.kind === 'ship';
    const def = isShip ? D.SHIP_DEFS[card.defId] : D.COMMAND_DEFS[card.defId];
    const fc = p.deckSide === 'Allies' ? 'us' : 'jp';
    const selected = view.selectedCardUid === card.uid;
    const canDeploy = isShip && myTurn && def.cost <= p.supply;
    const canCmd = !isShip && myTurn && !p.commandUsed && def.cost <= p.supply;
    const dim = !myTurn || (isShip ? !canDeploy : !canCmd);
    if (isShip) {
      const airCount = def.air ? Object.values(def.air).reduce((a, b) => a + b, 0) : 0;
      return `<div class="hcard ${fc} ${selected ? 'sel' : ''} ${dim ? 'dim' : ''}" data-card="${card.uid}">
        <div class="hc-stripe"></div>
        <div class="hc-cost">${def.cost}</div>
        <div class="hc-points"><b>${def.points}</b> 点</div>
        <div class="hc-class">${def.cls} · ${h(D.NATIONS[def.nation].short)}</div>
        <div class="hc-body">
          <div class="hc-name">${h(def.name)}</div>
          <div class="hc-sub">${h(def.hull || '')}${airCount ? ' · ' + airCount + ' 机' : ''}</div>
          <div class="hc-stats">
            <span>耐久 <b>${def.hp}</b></span>
            <span>主炮 <b>${def.main ? def.main.damage : '—'}</b></span>
            <span>副炮 <b>${def.secondary ? def.secondary.damage : '—'}</b></span>
            <span>鱼雷 <b>${def.torpedo || '—'}</b></span>
            <span>装甲 <b>${def.armor}</b></span>
            <span>防空 <b>${def.aa}</b></span>
            <span>深弹 <b>${def.asw || '—'}</b></span>
            <span>行动点 <b>${def.cls === 'DD' ? 2 : 1}</b></span>
          </div>
        </div>
      </div>`;
    }
    return `<div class="hcard cmd ${fc} ${selected ? 'sel' : ''} ${dim ? 'dim' : ''}" data-card="${card.uid}" data-tip="card:${card.uid}">
      <div class="hc-stripe"></div>
      <div class="hc-cost">${def.cost}</div>
      <div class="hc-points">指令</div>
      <div class="hc-class">${h(D.NATIONS[def.nation].short)} · COMMAND</div>
      <div class="hc-body">
        <div class="hc-name">${h(def.name)}</div>
        <div class="hc-sub">${def.target === 'none' ? '无需目标' : def.target === 'own' ? '选择己方目标' : '选择敌方目标'}</div>
        <div class="hc-effect">${h(def.desc)}</div>
      </div>
    </div>`;
  }

  /* ---------------- 行动栏 ---------------- */
  function renderActionBar() {
    const bar = document.getElementById('actionBar');
    if (!state) { bar.innerHTML = ''; return; }
    const human = view.humanSide;
    const myTurn = state.active === human && !state.finished && !view.busy;
    if (!myTurn) {
      bar.innerHTML = `<div class="action-info"><div class="aname">${state.finished ? '战役结束' : '等待中'}</div>
        <div class="ahint">${view.busy ? '对方正在指挥舰队…' : ''}</div></div><div class="action-buttons"></div>`;
      return;
    }
    const p = state.players[human];
    const sel = view.selectedUid ? E.getUnit(state, view.selectedUid) : null;
    let info = '', buttons = '', phaseBtn = '';
    const air = view.selectedAirUid ? state.airUnits.find(a => a.uid === view.selectedAirUid) : null;

    if (air) {
      const enemyShip = E.surfaceAt(state, air.r, air.c);
      const enemyAir = state.airUnits.find(a => a.side !== air.side && a.type === 'F' && a.r === air.r && a.c === air.c);
      info = `<div class="aname">战斗机 ×${air.planes.length} <span style="font-size:9px;color:var(--muted)">AIR PATROL</span></div>
        <div class="astats">行动力 ${air.ap}/${air.apMax} · 位置 R${air.r}C${air.c} · ${air.attacked ? '本回合已攻击' : '可攻击'}</div>
        <div class="ahint">移动后飞到敌舰格可永久削减其防空；遇到敌机可缠斗。</div>`;
      buttons = `
        <button class="act-btn" data-act="airMove" ${air.ap <= 0 ? 'disabled' : ''}>移动</button>
        <button class="act-btn" data-act="airAttackShip" ${(!enemyShip || enemyShip.side === air.side || air.attacked || air.ap <= 0) ? 'disabled' : ''}>攻击舰船</button>
        <button class="act-btn" data-act="airAttackAir" ${(!enemyAir || air.attacked || air.ap <= 0) ? 'disabled' : ''}>空战</button>
        <button class="act-btn ghost" data-act="cancel">取消</button>`;
      phaseBtn = `<button class="act-btn gold" data-act="endTurn">结束回合</button>`;
    } else if (view.mode === 'deploy' && view.selectedCardUid) {
      const card = p.hand.find(c => c.uid === view.selectedCardUid);
      const def = card && card.kind === 'ship' ? D.SHIP_DEFS[card.defId] : null;
      if (def) {
        info = `<div class="aname">部署 · ${h(def.name)}</div>
          <div class="astats">${def.cls} · ${def.points} 点 · 补给 ${def.cost}</div>
          <div class="ahint">点击高亮格部署；刚部署本回合不能移动/转向，但可以开火；再次点击取消</div>`;
      } else {
        info = `<div class="aname">部署</div><div class="ahint">点击高亮格部署。</div>`;
      }
      buttons = `<button class="act-btn ghost" data-act="cancel">取消选择</button>`;
      phaseBtn = `<button class="act-btn gold" data-act="endTurn">结束回合</button>`;
    } else if (view.mode) {
      info = modeInfoHtml(sel);
      buttons = modeButtonsHtml();
      phaseBtn = `<button class="act-btn gold" data-act="endTurn">结束回合</button>`;
    } else if (sel) {
      const canMove = E.canMove(state, sel);
      const canMain = E.canFireMain(state, sel) && E.mainTargets(state, sel).length > 0;
      const canSec = E.canFireSecondary(state, sel) && E.secondaryTargets(state, sel).length > 0;
      const canTorp = E.canFireTorp(state, sel) && E.torpedoTargets(state, sel).length > 0;
      const canDepth = E.canFireDepth(state, sel) && E.depthTargets(state, sel).length > 0;
      const canAA = E.canFireAA(state, sel) && E.aaTargets(state, sel).length > 0;
      const canStrike = sel.air && sel.air.some(g => g.planes.length) && !sel.launched && !sel.debuffs.dazed;
      const canSearch = (sel.cls === 'DD' || sel.cls === 'CVE') && !sel.searchBoost;
      const canFire = canMain || canSec || canTorp || canDepth;
      const turnLabel = sel.turnProgress > 0 ? `继续转向 ${sel.turnProgress}/${sel.turnCost}` : '转向';
      info = `<div class="aname">${h(sel.name)} <span style="font-size:9px;color:var(--muted)">${sel.cls} · ${h(D.NATIONS[sel.nation].short)}</span></div>

  /* ---------------- 战报 ---------------- */
  function renderLog() {
    const box = document.getElementById('log');
    if (!state) { box.innerHTML = ''; lastLogId = 0; return; }
    const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 20;
    state.log.filter(l => l.id > lastLogId).forEach(l => {
      const div = document.createElement('div');
      div.className = 'log-entry ' + (l.side ? (state.players[l.side].deckSide === 'Allies' ? 'us' : 'jp') : '') + ' ' + (l.kind || '');
      div.innerHTML = `<span class="lr">R${l.round}</span>${h(l.text)}`;
      box.appendChild(div); lastLogId = l.id;
    });
    if (state.log.length && atBottom) box.scrollTop = box.scrollHeight;
    document.getElementById('logCount').textContent = state.log.length + ' 条';
  }
  function resetLog() { lastLogId = 0; const box = document.getElementById('log'); if (box) box.innerHTML = ''; }

  /* ---------------- 点击 ---------------- */
  function onBoardClick(e) {
    if (!state || view.busy) return;
    const cell = e.target.closest('.cell'); if (!cell) return;
    const airEl = e.target.closest('[data-air-uid]');
    if (airEl) {
      if (handlers.onAir) handlers.onAir(parseInt(airEl.dataset.airUid, 10));
      return;
    }
    const r = parseInt(cell.dataset.r, 10), c = parseInt(cell.dataset.c, 10);
    const token = e.target.closest('[data-uid]');
    const uid = token ? parseInt(token.dataset.uid, 10) : null;
    // 手机端：单击选中/操作，只有双击舰船才打开介绍
    if (uid && !view.mode) {
      const now = Date.now();
      if (lastTapUid === uid && now - lastTapAt < 500) {
        lastTapUid = 0; lastTapAt = 0;
        if (handlers.onShipInfo) handlers.onShipInfo(uid);
        return;
      }
      lastTapUid = uid; lastTapAt = now;
    }
    if (handlers.onCell) handlers.onCell(r, c, uid);
  }

          <span>鱼雷装填</span><b>${u.torpedoState ? (u.cls === 'SS' ? (u.torpedoState.fore.reload > 0 ? '舰首装填中' : '舰首就绪') : '左' + (u.torpedoState.port.reload > 0 ? '装填' : '就绪') + ' / 右' + (u.torpedoState.starboard.reload > 0 ? '装填' : '就绪')) : '无'}</b>
          <span>防空</span><b>${Math.max(0, u.aa - (u.aaDown || 0))}${u.aaDown ? '（永久 -' + u.aaDown + '）' : ''}</b>

          <span>装甲</span><b>${u.armor}（炮火减伤）</b>

      const p = state.players[view.humanSide];
      const card = p.hand.find(c => c.uid === id); if (!card) return;
      if (card.kind === 'ship') {
        const def = D.SHIP_DEFS[card.defId];
        html = `<h4>${h(def.name)}</h4><div class="tt-sub">${h(D.NATIONS[def.nation].short)} · ${def.cls} · ${def.points} 点 · 补给 ${def.cost}</div>
          <div class="tt-grid">
            <span>耐久</span><b>${def.hp}</b>
            <span>装甲</span><b>${def.armor}</b>
            <span>主炮</span><b>${def.main ? '伤害 ' + def.main.damage + '（前' + def.main.arcs.fore + '/后' + def.main.arcs.aft + '/左' + def.main.arcs.port + '/右' + def.main.arcs.starboard + '）' : '无'}</b>
            <span>副炮</span><b>${def.secondary ? '伤害 ' + def.secondary.damage + '，射程 ' + def.secondary.range : '无'}</b>
            <span>鱼雷</span><b>${def.torpedo || '无'}</b>
            <span>防空</span><b>${def.aa}</b>
            <span>深弹</span><b>${def.asw || '无'}</b>

          </div>

    tooltipEl.innerHTML = html; tooltipEl.classList.add('show'); positionTooltip(x, y);

  function positionTooltip(x, y) {
    const pad = 12, r = tooltipEl.getBoundingClientRect();
    let left = x + 16, top = y + 16;
    if (left + r.width > window.innerWidth - pad) left = x - r.width - 16;
    if (top + r.height > window.innerHeight - pad) top = y - r.height - 16;
    tooltipEl.style.left = Math.max(pad, left) + 'px';
    tooltipEl.style.top = Math.max(pad, top) + 'px';
  }
  function hideTooltip() { if (tooltipEl) tooltipEl.classList.remove('show'); }

  function toast(msg) {
    const el = document.getElementById('toast'); el.textContent = msg;
    el.classList.add('show'); clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove('show'), 2000);
  }

  function showDeckBuilder(deck, cb) {
    let cur = D.cloneDeck(deck);
    let tab = 'ships';
    let nation = 'ALL';
    let shipTabClicks = 0;
    const wrap = document.createElement('div');
    wrap.className = 'modal-wrap show';
    document.getElementById('modalRoot').appendChild(wrap);
    modalEl = wrap;

    function renderBuilder() {
      const st = D.deckStats(cur);
      const errs = D.validateDeck(cur);
      const pool = D.cardPoolForSide(cur.side);
      const nations = Array.from(new Set(pool.ships.map(d => d.nation)));
      const list = tab === 'ships'
        ? pool.ships.filter(d => nation === 'ALL' || d.nation === nation)
        : pool.commands.filter(d => nation === 'ALL' || d.nation === nation);
      const rows = list.map(d => {
        const isShip = tab === 'ships';
        const count = isShip ? cur.ships.filter(id => D.SHIP_DEFS[id].name === d.name).length : cur.commands.filter(id => id === d.id).length;
        const maxed = isShip && (count >= D.MAX_COPIES || (d.cls === 'SS' && st.subCount >= D.MAX_SUBS));
        const stats = isShip
          ? `${d.cls} · ${d.points} 点 · 补给 ${d.cost} · 耐久 ${d.hp} · 主炮 ${d.main ? d.main.damage : '—'} · 装甲 ${d.armor}`
          : `指令 · ${d.cost} 费 · ${h(d.desc)}`;
        return `<div class="builder-card ${count ? 'in' : ''}">
          <div class="bc-main"><div class="bc-name">${h(d.name)} <small>${h(D.NATIONS[d.nation].short)}</small></div>
            <div class="bc-stats">${stats}</div></div>
          <button class="bc-btn" data-add="${d.id}" ${maxed ? 'disabled' : ''}>${count ? '×' + count : '＋'}</button>
        </div>`;
      }).join('');
      const deckShips = {};
      cur.ships.forEach(id => {
        const d = D.SHIP_DEFS[id];
        deckShips[d.name] = deckShips[d.name] || { def: d, n: 0 };
        deckShips[d.name].n++;
      });
      const deckRows = Object.keys(deckShips).map(name => {
        const x = deckShips[name];
        return `<div class="builder-deck-row"><span>${h(name)}${x.n > 1 ? ' ×' + x.n : ''}</span><small>${x.def.cls} · ${x.def.points}</small><button data-remove-ship="${h(name)}">×</button></div>`;
      }).join('');
      const cmdRows = cur.commands.map(id => {
        const d = D.COMMAND_DEFS[id];
        return `<div class="builder-deck-row"><span>${h(d.name)}</span><small>指令 · ${d.cost} 费</small><button data-remove-cmd="${id}">×</button></div>`;
      }).join('');
      wrap.innerHTML = `<div class="builder-panel">
        <div class="builder-head">
          <div><div class="end-kicker">DECK BUILDER</div><div class="builder-title">组建牌组 · ${D.SIDES[cur.side].name}</div></div>
          <div class="builder-totals">
            <div><b>${st.points}</b><span>/120 吨位</span></div>
            <div><b>${st.capital}</b><span>/60 主力</span></div>
            <div><b>${st.shipCount}</b><span>舰船</span></div>
            <div><b>${st.subCount}</b><span>/${D.MAX_SUBS} 潜艇</span></div>
            <div><b>${st.commandCount}</b><span>/8 指令</span></div>
          </div>
        </div>
        <div class="builder-body">
          <div class="builder-pool">
            <div class="builder-tabs">
              <button class="${tab === 'ships' ? 'on' : ''}" data-tab="ships">舰船池</button>
              <button class="${tab === 'commands' ? 'on' : ''}" data-tab="commands">指令池</button>
            </div>
            <div class="builder-filters">
              <button class="${nation === 'ALL' ? 'on' : ''}" data-nation="ALL">全部</button>
              ${nations.map(n => `<button class="${nation === n ? 'on' : ''}" data-nation="${n}">${h(D.NATIONS[n].short)}</button>`).join('')}
            </div>
            <div class="builder-list">${rows || '<div class="hidden-note">没有可用的卡。</div>'}</div>
          </div>
          <div class="builder-deck">
            <div class="builder-sub">当前牌组</div>
            <div class="builder-deck-list">${deckRows || '<div class="hidden-note">还没有舰船</div>'}</div>
            <div class="builder-sub">指令卡 · ${cur.commands.length}/8</div>
            <div class="builder-deck-list">${cmdRows || '<div class="hidden-note">还没有指令卡</div>'}</div>
            <div class="builder-errors">${errs.length ? errs.map(e => `<div>· ${h(e)}</div>`).join('') : '<div style="color:var(--green)">牌组合法，可以出战。</div>'}</div>
            <div class="builder-actions">
              <button class="act-btn ghost" data-preset="1">使用预设</button>
              <button class="act-btn ghost" data-clear="1">清空</button>
              <button class="act-btn" data-cancel="1">取消</button>
              <button class="act-btn gold" data-done="1" ${errs.length ? 'disabled' : ''}>完成</button>
            </div>
          </div>
        </div>
      </div>`;
    }

    wrap.addEventListener('click', e => {
      if (e.target === wrap) { closeModal(); if (cb.onCancel) cb.onCancel(); return; }
      const add = e.target.closest('[data-add]');
      if (add && !add.disabled) {
        const id = add.dataset.add;
        if (tab === 'ships') {
          const d = D.SHIP_DEFS[id];
          const count = cur.ships.filter(x => D.SHIP_DEFS[x].name === d.name).length;
          const subs = cur.ships.filter(x => D.SHIP_DEFS[x].cls === 'SS').length;
          if (d.cls === 'SS' && subs >= D.MAX_SUBS) { toast('潜艇已经达到上限 ' + D.MAX_SUBS + ' 艘'); return; }
          if (count < D.MAX_COPIES) cur.ships.push(id);
        } else {
          if (cur.commands.length < D.MAX_COMMANDS) cur.commands.push(id);
        }
        renderBuilder(); return;
      }
      const rs = e.target.closest('[data-remove-ship]');
      if (rs) {
        const name = rs.dataset.removeShip;
        const idx = cur.ships.findIndex(id => D.SHIP_DEFS[id].name === name);
        if (idx >= 0) cur.ships.splice(idx, 1);
        renderBuilder(); return;
      }
      const rc = e.target.closest('[data-remove-cmd]');
      if (rc) {
        const idx = cur.commands.indexOf(rc.dataset.removeCmd);
        if (idx >= 0) cur.commands.splice(idx, 1);
        renderBuilder(); return;
      }
      const tabBtn = e.target.closest('[data-tab]');
      if (tabBtn) {
        if (tabBtn.dataset.tab === 'ships' && cur.side === 'Allies') {
          shipTabClicks++;
          if (shipTabClicks >= 5) {
            shipTabClicks = 0;
            if (cur.commands.includes('us_cmd_yorktown_sisters')) {
              toast('约克城三姐妹已经在你的牌组里了。');
            } else {
              let replaced = null;
              if (cur.commands.length >= D.MAX_COMMANDS) replaced = cur.commands.pop();
              cur.commands.push('us_cmd_yorktown_sisters');
              toast(replaced
                ? '叮——约克城三姐妹加入牌组（替换了「' + D.COMMAND_DEFS[replaced].name + '」）。'
                : '叮——约克城三姐妹加入了牌组。');
            }
            tab = 'ships';
            renderBuilder();
            return;
          }
        }
        tab = tabBtn.dataset.tab;
        renderBuilder();
        return;
      }
      const nat = e.target.closest('[data-nation]');
      if (nat) { nation = nat.dataset.nation; renderBuilder(); return; }
      if (e.target.closest('[data-preset]')) { cur = D.cloneDeck(D.STARTER_DECKS[cur.side]); renderBuilder(); return; }
      if (e.target.closest('[data-clear]')) { cur.ships = []; cur.commands = []; renderBuilder(); return; }
      if (e.target.closest('[data-cancel]')) { closeModal(); if (cb.onCancel) cb.onCancel(); return; }
      if (e.target.closest('[data-done]')) {
        const errs = D.validateDeck(cur);
        if (errs.length) return;
        closeModal(); if (cb.onDone) cb.onDone(cur);
      }
    });
    renderBuilder();
  }

    </div>`;
    document.getElementById('modalRoot').appendChild(wrap);
    modalEl = wrap;
    wrap.addEventListener('click', e => { if (e.target === wrap || e.target.dataset.close) closeModal(); });
  }

  function openFirePanel(unit, onConfirm) {
    const rows = [];
    function addRow(weapon, label, targets, infoFn, extra) {
      if (!targets.length) return;
      const opts = targets.map(t => {
        const info = infoFn(t);
        const dmg = info ? info.final : 0;
        const arc = info ? ` ${info.arc} ${info.barrels}/${info.max}` : '';
        return `<option value="${t.uid}">${h(D.NATIONS[t.nation].short)}「${h(t.name)}」 — 预计 ${dmg}${arc}</option>`;
      }).join('');
      rows.push(`<div class="fire-row"><label>${label}</label><select class="fire-select" data-weapon="${weapon}"><option value="">不发射</option>${opts}</select></div>`);
    }
    addRow('main', '主炮', E.mainTargets(state, unit), t => E.mainAttackInfo(unit, t));
    addRow('secondary', '副炮', E.secondaryTargets(state, unit), t => E.secondaryAttackInfo(unit, t));
    const torpInfo = t => { const i = E.torpedoAttackInfo(unit, t); return { final: i.final, arc: '鱼雷', barrels: '', max: '' }; };
    if (unit.cls === 'SS') {
      addRow('torpFore', '舰首鱼雷', E.torpedoTargets(state, unit, 'fore'), torpInfo);
    } else if (unit.torpedo) {
      addRow('torpPort', '左舷鱼雷', E.torpedoTargets(state, unit, 'port'), torpInfo);
      addRow('torpStarboard', '右舷鱼雷', E.torpedoTargets(state, unit, 'starboard'), torpInfo);
    }
    addRow('depth', '深弹', E.depthTargets(state, unit), t => ({ final: unit.asw, arc: '深弹', barrels: '', max: '' }));
    if (!rows.length) { toast('没有可开火的目标'); return; }
    const fightHeading = (unit.turnPreHeading && (unit.turned || unit.turnProgress > 0)) ? unit.turnPreHeading : unit.heading;
    const wrap = document.createElement('div');
    wrap.className = 'modal-wrap show';
    wrap.innerHTML = `<div class="fire-panel">

      <div class="fire-title">${h(unit.name)} · 开火</div>

        closeModal();
        onConfirm(sel);
      }
    });
  }
